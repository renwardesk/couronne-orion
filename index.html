<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orion">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Couronne d'Orion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a single-column command console. Sticky header carries the planet's stock; a fixed tab bar switches decks. Deliberately one dark star-chart look. */
:root{
  --void:#0c1226; --panel:#131b36; --panel2:#1a2447; --line:#2a3663; --ink:#e7e9f6; --dim:#8f98be;
  --brass:#e3ac55; --brass-ink:#1d1406; --good:#5fd49e; --bad:#ff7070; --warn:#ffcf6b;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 72% 8%,#ffffff40 50%,transparent 51%),radial-gradient(1px 1px at 38% 64%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 88% 52%,#ffffff44 50%,transparent 51%),radial-gradient(900px 500px at 80% -10%,#2a2560 0%,transparent 70%);background-attachment:fixed}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--void) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:grid;gap:8px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--brass)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);min-width:0}
.who b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.resbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res{min-width:0}
.res .lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.res b{font-family:var(--f-data);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.res small{font-family:var(--f-data);font-size:11px;color:var(--good);margin-left:4px}
.res .cap{display:block;height:3px;background:var(--panel2);border-radius:2px;margin-top:4px;overflow:hidden}
.res .cap i{display:block;height:100%;background:var(--brass)}
.res.full .cap i{background:var(--bad)}
.psel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.psel select{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
main.wrap{padding-block:18px;display:grid;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:600}
.meta{color:var(--dim);font-size:13px;margin:4px 0 0}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--brass);color:var(--brass);margin-left:6px;vertical-align:1px}
.phead{display:flex;gap:14px;align-items:center}
.orb{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:inset -10px -8px 18px #0009,0 0 24px -6px var(--glow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{background:var(--panel);padding:12px 14px;display:grid;gap:8px}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ihead b{font-weight:600}
.lv{font-family:var(--f-data);font-size:13px;color:var(--brass);white-space:nowrap}
.eff{font-size:13px;color:var(--dim)}
.eff em{font-style:normal;color:var(--ink);font-family:var(--f-data);font-size:12.5px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;justify-content:space-between}
.costs{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-data);font-size:12.5px;font-variant-numeric:tabular-nums}
.costs .no{color:var(--bad)}
.costs .t{color:var(--dim)}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:7px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#2a0606}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.prog{display:block;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),#ffd99a);transition:width .9s linear}
.cd{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim)}
.stats span b{color:var(--ink);font-family:var(--f-data);font-weight:500}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{background:var(--panel2);border:0;width:32px;height:32px;cursor:pointer;font-size:16px}
.step button.w{width:auto;padding:0 8px;font-size:12px}
.step span{min-width:40px;text-align:center;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.locked{opacity:.55}
.empty{color:var(--dim);font-size:14px;padding:6px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:10px 0 12px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim);cursor:pointer;position:relative}
.tab[aria-current="true"]{color:var(--brass)}
.tab[aria-current="true"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--brass)}
.tab .n{position:absolute;top:4px;right:12%;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#2a0606;font-family:var(--f-data);font-size:10px;line-height:16px;padding:0 4px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0a0f20}
#map{display:block;width:100%;aspect-ratio:1;max-width:100%;cursor:crosshair;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.hostile{border-left:3px solid var(--bad)}
.tone-win{border-left:3px solid var(--good)}
.tone-loss{border-left:3px solid var(--bad)}
.tone-info{border-left:3px solid var(--line)}
.rep p{margin:0;font-size:13px;color:var(--dim)}
.rep time{font-family:var(--f-data);font-size:12px;color:var(--dim)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.rank .pos{font-family:var(--f-display);font-size:20px;color:var(--brass);text-align:center}
.rank .sc{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.scrim{position:fixed;inset:0;background:#05081499;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:14px;border-bottom:1px solid var(--line)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.sum dt{color:var(--dim)}
.sum dd{margin:0;font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--good);padding:10px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px #0008}
.toast.bad{border-left-color:var(--bad)}
.join{display:grid;gap:14px;padding-block:20px}
.join input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--void) inset}
.hero{font-family:var(--f-display);font-size:42px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.hero span{color:var(--brass)}
.lead{color:var(--dim);max-width:60ch;margin:0}
.rules{display:grid;gap:6px;font-size:14px;color:var(--dim);padding-left:18px;margin:0}
.tools{display:flex;gap:6px;align-items:center;min-width:0}
.tgl{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tgl[aria-pressed="true"]{color:var(--brass);border-color:var(--brass)}
#v3{padding-top:16px}
.v3box{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1c2552 0%,#0a0f20 70%)}
#v3c{display:block;width:100%;height:clamp(300px,92vw,480px);touch-action:pan-y;cursor:grab}
.v3btn{position:absolute;top:10px;right:10px;background:color-mix(in srgb,var(--void) 70%,transparent);backdrop-filter:blur(6px)}
#v3.v3full{position:fixed;inset:0;z-index:40;padding:0;max-width:none;background:#04060f}
#v3.v3full .v3box{height:100%;border:0;border-radius:0}
#v3.v3full #v3c{height:100%;touch-action:none}
#v3.v3full .v3btn{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
#v3.v3full .v3cap{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px))}
#v3c:active{cursor:grabbing}
.v3cap{position:absolute;left:12px;right:12px;bottom:10px;font-family:var(--f-data);font-size:11.5px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000}
.v3cap b{color:var(--ink);font-weight:500}
#mp{padding-top:16px}
.btov{position:fixed;inset:0;z-index:60;background:#04060f}
#btc{display:block;width:100%;height:100%;touch-action:none}
.bthud{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));display:grid;gap:6px;background:linear-gradient(#04060fe6,#04060f00);pointer-events:none}
#bttitle{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em}
.btforces{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-data);font-size:11.5px;color:var(--dim)}
.btbtns{display:flex;gap:8px;pointer-events:auto}
.btbtns .tgl{background:color-mix(in srgb,var(--void) 70%,transparent);padding:6px 12px;font-size:12px}
.btchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--panel2);border:1px solid var(--bad);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:13px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px #0008;cursor:pointer}
#hg{padding-top:16px}
#hgc{display:block;width:100%;height:clamp(280px,82vw,460px);touch-action:pan-y;cursor:grab}
.ml.dim{background:transparent;color:var(--dim);font-size:10px;padding:0 4px}
.ml.ev{color:var(--warn);outline:1px solid color-mix(in srgb,var(--warn) 55%,transparent)}
.ml.bad{color:var(--bad);outline-color:var(--bad)}
#mpc{display:block;width:100%;height:clamp(320px,100vw,560px);touch-action:pan-y;cursor:grab}
#mp.v3full{position:fixed;inset:0;z-index:40;padding:0;max-width:none;background:#04060f}
#mp.v3full .v3box{height:100%;border:0;border-radius:0}
#mp.v3full #mpc{height:100%;touch-action:none}
#mp.v3full .v3btn{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
#mp.v3full .mpnav{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
.mplab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ml{position:absolute;left:0;top:0;font-family:var(--f-data);font-size:11px;white-space:nowrap;color:var(--ink);background:#0a0f20b0;padding:2px 7px;border-radius:4px;will-change:transform}
.ml.big{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ml.big i{font-style:normal;font-family:var(--f-data);font-size:11px;text-transform:none;letter-spacing:0;color:var(--dim)}
.ml.me{outline:1px solid var(--brass)}
.mpnav{position:absolute;top:10px;left:10px;right:110px;display:flex;flex-wrap:wrap;gap:6px}
.mpnav .tgl{background:color-mix(in srgb,var(--void) 70%,transparent);backdrop-filter:blur(6px)}
details.card summary{cursor:pointer;font-size:14px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.prog b{transition:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}input,select{font-size:16px!important}</style>
</head>
<body>

<header class="top" id="top" hidden></header>
<section class="wrap" id="v3" hidden><div class="v3box"><canvas id="v3c" aria-label="Vue 3D de ta planète : glisse pour tourner, pince pour zoomer"></canvas><div class="v3cap" id="v3cap"></div><button class="tgl v3btn" id="v3full" type="button">Plein écran</button></div></section>
<section class="wrap" id="hg" hidden><div class="v3box"><canvas id="hgc" aria-label="Hangar 3D : glisse pour tourner, pince pour zoomer"></canvas><div class="v3cap" id="hgcap"></div></div></section>
<section class="wrap" id="mp" hidden><div class="v3box mpbox"><canvas id="mpc" aria-label="Carte 3D de l’univers : glisse pour tourner, pince pour zoomer, touche pour entrer"></canvas><div id="mplab" class="mplab"></div><div class="mpnav" id="mpnav"></div><button class="tgl v3btn" id="mpfull" type="button">Plein écran</button></div></section>
<main class="wrap" id="main"><div class="join"><div class="hero">Couronne <span>d'Orion</span></div><p class="lead">Connexion à la galaxie…</p></div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="bt" class="btov" hidden><canvas id="btc" aria-label="Animation de la bataille"></canvas><div class="bthud"><div><b id="bttitle"></b><span id="btround" class="eff"></span></div><div class="btforces" id="btforces"></div><div class="btbtns"><button class="tgl" id="btreplay" type="button">Rejouer</button><button class="tgl" id="btclose" type="button">Fermer</button></div></div></div>
<div id="btchip"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// ---------- utilitaires ----------
const TAB_ID='t'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const err=m=>({message:m});
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtDur(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h${String(m).padStart(2,'0')}`:m?`${m}min ${String(x).padStart(2,'0')}s`:`${x}s`}
const clock=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

// ---------- règles du jeu ----------
const COLORS=['#5ec8ff','#ff8a5c','#b98cff','#6fe3a1','#ff6fae','#ffd25e','#4fe0d6','#c7d36a'];
const RES={m:'Métal',c:'Cristal',f:'Hélium-3'};
const RARE={ir:'Iridium',xe:'Xénite',am:'Antimatière'};
const PT4=['tel','vol','gla','gaz'];
const PTYPES={tel:{n:'Tellurique',m:1,c:1,f:1,col:'#6f9d77'},vol:{n:'Volcanique',m:1.3,c:.9,f:1,col:'#d0714a'},gla:{n:'Glaciaire',m:.9,c:1.3,f:1,col:'#8fd0ea'},gaz:{n:'Gazeuse',m:.85,c:1,f:1.4,col:'#c9a0e8'},
  ast:{n:'Ceinture d’astéroïdes',m:0,c:0,f:0,col:'#a39684',rare:'ir'},moon:{n:'Lune morte',m:0,c:0,f:0,col:'#b9c2cf',rare:'xe'},anom:{n:'Anomalie',m:0,c:0,f:0,col:'#6ff0d0',rare:'am'},raid:{n:'Écumeurs du Vide',m:0,c:0,f:0,col:'#ff4d6d'}};
const SHIPS={
  fighter:{n:'Chasseur',cost:{m:40,c:15,f:0},t:12,att:6,hp:22,spd:1.6,cap:15,fuel:1,yard:1},

function accrue(q,t){const dt=(t-q.at)/60000;if(dt<=0)return;const r=rates(q),cp=capOf(q);for(const k in RES)if(q.res[k]<cp)q.res[k]=Math.min(cp,q.res[k]+r[k]*dt);q.at=t}
function runQ(list,t,add){const keep=[];for(const it of list||[]){if(t>it.start){const done=Math.min(it.n,Math.floor((t-it.start)/(it.per*1000)));if(done>0){add(it.t,done);it.n-=done;it.start+=done*it.per*1000}}if(it.n>0)keep.push(it)}return keep}

  q.ships=Object.assign(zeroShips(),q.ships||{});q.mods=q.mods||{};
  {const bq=[...(q.build?[q.build]:[]),...(q.bq||[])];q.build=null;while(bq.length&&bq[0].until<=t){const it=bq.shift();accrue(q,it.until);q.lv[it.k]=(q.lv[it.k]||0)+1}q.bq=bq}
  accrue(q,t);

// depuis quand une meute grossit sans être dérangée
function packBorn(ev){let t=EPOCH;if(ev){if(ev.done)t=Math.max(t,(ev.doneAt||0)+RESPAWN);else t=Math.max(t,(ev.at||0)+RESPAWN)}return t}
const lairDelay=s=>LAIR_DELAY+(hash('lair'+s.i)%6)*HR;
// repaire actif d'un système : {lid, pid de la planète occupée, founded} ou null
function lairInfoAt(s,now=Date.now()){const le=S.events[s.lair];let founded;
  if(le&&le.founded&&!le.done)founded=le.founded;
  else{let born=packBorn(S.events[s.packs[0]]);if(le&&le.done)born=Math.max(born,le.doneAt||0);founded=born+lairDelay(s);if(now<founded)return null}
  const order=[...s.planets].sort((a,b)=>hash(a+'lair')-hash(b+'lair')),pid=order.find(p=>!(S.planets[p]&&S.planets[p].owner));return pid?{lid:s.lair,pid,founded}:null}
function raidGarrison(pid,ev,now){const R=RAIDS[pid];if(!R.local)return ev&&ev.remaining?ev.remaining:R.ships;
  if(ev&&!ev.done&&now-(ev.at||0)<RESPAWN)return ev.remaining||R.ships;
  const s=SYSTEMS[R.sys];if(R.lair){const L=lairInfoAt(s,now);const h=L?Math.max(0,(now-L.founded)/HR):0;return scaleShips(R.ships,Math.min(4,1+.15*h))}
  const h=Math.max(0,(now-packBorn(ev))/HR);return scaleShips(R.ships,Math.min(3,1+.08*h)*(lairInfoAt(s,now)?1.5:1))}
function raidState(pid){const R=RAIDS[pid],ev=S.events[pid],now=Date.now();if(!R)return{garrison:{},done:true};
  if(R.lair){if(!lairInfoAt(SYSTEMS[R.sys],now))return{garrison:{},done:true,absent:true};return{garrison:raidGarrison(pid,ev&&ev.done?null:ev,now),done:false}}
  if(ev&&ev.done){if(!R.local)return{garrison:{},done:true,back:null};if(now-(ev.doneAt||0)<=RESPAWN)return{garrison:{},done:true,back:(ev.doneAt||0)+RESPAWN}}
  return{garrison:raidGarrison(pid,ev,now),done:false}}

// verrou coopératif sur un document
async function locked(path,fn){const ref=db.doc(path);
  for(let i=0;i<10;i++){let r;try{r=await ref.acquire({holder:TAB_ID,ttlMs:2500})}catch(e){if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await sleep(600);continue}throw e}
    if(r.acquired){const s=await ref.get();const d=s.exists?s.data():null;return await fn(d&&d.kind?clone(d):null,ref)}
    await sleep(250+Math.random()*600)}
  throw err('Cible occupée, réessaie dans un instant.')}
// doc joueur : règle les minerais rares accumulés avant toute modification
async function withPlayer(uid,fn){return locked('players/'+uid,async(d,ref)=>{if(!d)throw err('Empire introuvable.');const now=Date.now(),rt=rareRates(uid),dt=Math.max(0,(now-(d.rareAt||now))/60000);
  d.rare=d.rare||{};for(const k in RARE)d.rare[k]=(d.rare[k]||0)+rt[k]*dt;d.culture=(d.culture??50)+cultureRate(uid)*dt;d.rareAt=now;
  if(d.research&&d.research.until<=now){d.tech=d.tech||{};d.tech[d.research.k]=(d.tech[d.research.k]||0)+1;d.research=null}
  const res=await fn(d);await ref.set(d);return res})}

    throw err('Aucune planète libre trouvée.')})}

async function gatherJoiners(f){const out=[];for(const j of Object.values(S.fleets)){if(j.group!==f.fid||j.phase!=='out'||j.fid===f.fid)continue;
  try{await locked('fleets/'+j.fid,async(jd,jref)=>{if(jd&&jd.phase==='out'&&jd.group===f.fid&&jd.to===f.to)out.push({f:jd,ref:jref})})}catch(e){}}return out}
function avgMods(list){const acc={};let W=0;for(const x of list){const w=worth(x.ships)||1;W+=w;const m=modsOf(x.owner);
  for(const k in m){const a=acc[k]=acc[k]||{att:0,hp:0,vs:{},red:0};a.att+=m[k].att*w;a.hp+=m[k].hp*w;a.red+=m[k].red*w;for(const t in m[k].vs)a.vs[t]=(a.vs[t]||0)+m[k].vs[t]*w}}
  for(const k in acc){const a=acc[k];a.att/=W;a.hp/=W;a.red/=W;for(const t in a.vs)a.vs[t]/=W}return acc}
function groupFight(forces,def,md){const tot={};for(const x of forces)for(const k in x.ships)if(x.ships[k]>0)tot[k]=(tot[k]||0)+x.ships[k];
  const B=battle(tot,def,avgMods(forces),md),surv=forces.map(()=>zeroShips());
  for(const k in tot){const before=tot[k],after=B.a[k]||0;let rem=after;const sh=forces.map((x,i)=>({i,n:x.ships[k]||0}));
    sh.forEach(s=>{const v=Math.floor(after*s.n/before);surv[s.i][k]=v;rem-=v});sh.sort((a,b)=>b.n-a.n);for(let q=0;rem>0&&q<sh.length*2;q++){const s=sh[q%sh.length];if(surv[s.i][k]<s.n){surv[s.i][k]++;rem--}}}
  return{B,surv}}
// répartit un butin disponible selon la soute des survivants
function splitLoot(avail,surv){const caps=surv.map(s=>cargoCap(s)),C=caps.reduce((a,b)=>a+b,0),tot=avail.m+avail.c+avail.f;if(!C||!tot)return surv.map(()=>({m:0,c:0,f:0}));
  const take=Math.min(1,C/tot);return caps.map(c=>({m:Math.floor(avail.m*take*c/C),c:Math.floor(avail.c*take*c/C),f:Math.floor(avail.f*take*c/C)}))}
const sumLoot=a=>a.reduce((t,x)=>({m:t.m+x.m,c:t.c+x.c,f:t.f+x.f}),{m:0,c:0,f:0});
const treasureOf=units=>{const w=worth(units);return{m:Math.round(w*55),c:Math.round(w*40),f:Math.round(w*20)}};

async function homecoming(f,fref){let dest=f.from;const o=S.planets[dest];

  if(f.rareCargo&&S.players[f.owner])await withPlayer(f.owner,d=>{for(const k in f.rareCargo)d.rare[k]=(d.rare[k]||0)+f.rareCargo[k]}).catch(()=>{});

async function resolveDue(){if(!db||S.spectator)return;const now=Date.now();
  for(const f of Object.values(S.fleets)){if(busy.has(f.fid))continue;if(f.group){const L=S.fleets[f.group];if(L&&L.phase==='out')continue}const due=f.phase==='out'?f.arrive<=now:f.phase==='back'?f.back<=now:false;if(!due)continue;
    busy.add(f.fid);try{await locked('fleets/'+f.fid,async(fd,fref)=>{if(!fd||fd.phase!==f.phase)return;if(fd.phase==='out')await arrival(fd,fref);else await homecoming(fd,fref)})}catch(e){if(e&&e.code==='invalid_argument')S.spectator=true}finally{busy.delete(f.fid)}}}

function ptsMat(k){const m=new THREE.ShaderMaterial({uniforms:{pr:{value:MP.r.getPixelRatio()},k:{value:k},op:{value:1}},

function ptsGeo(n){const g2=new THREE.BufferGeometry();g2.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g2.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));g2.setAttribute('sz',new THREE.BufferAttribute(new Float32Array(n),1));g2.setAttribute('rg',new THREE.BufferAttribute(new Float32Array(n),1));return g2}
function glowTex(){return canvasTex(128,128,(x,W)=>{const g2=x.createRadialGradient(64,64,0,64,64,64);g2.addColorStop(0,'rgba(255,255,255,1)');g2.addColorStop(.2,'rgba(255,240,220,.55)');g2.addColorStop(.55,'rgba(255,220,200,.12)');g2.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g2;x.fillRect(0,0,W,W)})}
function galaxyCloud(g){const G=GALS[g],r=rng(500+g),N=g===0?6500:5200,geo=ptsGeo(N),P=geo.attributes.position.array,C=geo.attributes.color.array,Z=geo.attributes.sz.array;
  const gs=()=>{let u=0;for(let i=0;i<4;i++)u+=r();return(u-2)/1.2};
  for(let i=0;i<N;i++){let ang,rad,z,col;const q=r();
    if(q<.2){ang=r()*Math.PI*2;rad=Math.abs(gs())*85;z=gs()*30*(1-rad/200);col=[1,.82,.58]}
    else if(G.shape==='spiral'){const arm=Math.floor(r()*G.arms),t=Math.pow(r(),.85);ang=arm*2*Math.PI/G.arms+t*G.twist+gs()*.22;rad=60+t*420+gs()*34;z=gs()*12*(1-rad/650);const b=.75+r()*.25;col=r()<.06?[1,.42,.7]:[b*.72,b*.82,b]}

    else{ang=r()*Math.PI*2;rad=330+gs()*55;z=gs()*14;const b=.75+r()*.25;col=r()<.08?[.5,1,.9]:[b*.7,b*.85,b]}

    P[i*3]=w[0];P[i*3+1]=w[1];P[i*3+2]=w[2];C[i*3]=col[0]*.55;C[i*3+1]=col[1]*.55;C[i*3+2]=col[2]*.55;Z[i]=1.2+r()*2.2}

function mpInit(){if(MP.tried)return MP.ok;MP.tried=true;if(!window.THREE)return false;
  try{const r=new THREE.WebGLRenderer({canvas:mpc,antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));MP.r=r;
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.01,8000);MP.scene=scene;MP.cam=cam;
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(4000,48,24),new THREE.MeshBasicMaterial({map:skyTex(),side:THREE.BackSide,depthWrite:false})));
    scene.add(new THREE.AmbientLight(0x8090c0,.35));
    const gt=glowTex();

const BSTOPS={ast:[[-.5,'#3a312a'],[-.1,'#5c4e42'],[.15,'#857463'],[.4,'#a99a88']],moon:[[-.6,'#4a4e57'],[-.1,'#7b818c'],[.15,'#a6acb6'],[.4,'#d3d7de']],anom:[[-.5,'#120a26'],[0,'#2a1b4a'],[.2,'#3d6b78'],[.4,'#7af0d0']]};

    const pg=new THREE.BufferGeometry(),pp=[];for(let i=0;i<400;i++){const a=r()*Math.PI*2,R=1.4+r()*1.6;pp.push(Math.cos(a)*R,(r()-.5)*.8,Math.sin(a)*R)}pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));belt.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xa0fff0,size:.035,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false})))}

function btBoom(pos,big){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:BT.glow,color:0xffa040,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));s.position.copy(pos);BT.g.add(s);
  const n=24,pg=new THREE.BufferGeometry(),pp=new Float32Array(n*3),vel=[];for(let i=0;i<n;i++){pp.set([pos.x,pos.y,pos.z],i*3);vel.push(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*4))}
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffc070,size:.25,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));BT.g.add(pts);
  BT.fx.push({boom:s,pts,vel,t:0,big});const now=performance.now();if(now-BT.lastBoom>90||!BT.lastBoom){BT.lastBoom=now;noise(big?.9:.5,{f:big?160:260,f2:60,vol:big?.32:.2})}}
function btBeam(a,b,col){const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const l=new THREE.Line(geo,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));BT.g.add(l);
  const fl=new THREE.Sprite(new THREE.SpriteMaterial({map:BT.glow,color:col,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));fl.position.copy(b);fl.scale.setScalar(1.2);BT.g.add(fl);BT.fx.push({beam:l,flash:fl,t:0});
  const now=performance.now();if(now-BT.lastBeep>110){BT.lastBeep=now;tone(col===0xff5a5a?520:900,.08,{type:'sawtooth',vol:.025,slide:.5})}}
const btShooter=u=>u.alive&&u.k!=='colony'&&u.k!=='probe';
function btLoop(t){BT.raf=requestAnimationFrame(btLoop);const dt=Math.min(.05,(t-BT.last)/1000||0);BT.last=t;const D=BT.rep.battle,R=D.rounds.length,e=(t-BT.t0)/1000-1.2;
  if(!BT.drag)BT.yaw+=dt*.06;BT.cam.position.set(Math.sin(BT.yaw)*34,11,Math.cos(BT.yaw)*34);BT.cam.lookAt(2,0,0);
  for(const u of BT.units)if(u.alive){const b=u.m.userData.base;u.m.position.y=b.y+Math.sin(t/700+u.m.userData.ph)*.25;if(u.k!=='turret')u.m.position.x=b.x+(u.side==='a'?1:-1)*Math.min(3,Math.max(0,e)*.4)}
  const ri=e<0?-1:Math.floor(e/RD);
  if(ri>=0&&ri<R){const u=e-ri*RD;
    if(u<2.3){const A=BT.units.filter(x=>x.side==='a'&&btShooter(x)),Dd=BT.units.filter(x=>x.side==='d'&&btShooter(x)),ta=BT.units.filter(x=>x.side==='d'&&x.alive),tdd=BT.units.filter(x=>x.side==='a'&&x.alive);
      const rate=Math.min(26,(A.length+Dd.length)*1.1);if(Math.random()<rate*dt){const fromA=Math.random()<A.length/((A.length+Dd.length)||1);const S1=fromA?A:Dd,T1=fromA?ta:tdd;if(S1.length&&T1.length){const s=S1[Math.floor(Math.random()*S1.length)],tg=T1[Math.floor(Math.random()*T1.length)];
        const p1=s.m.position.clone().add(new THREE.Vector3((s.side==='a'?1:-1)*.8,0,0)),p2=tg.m.position.clone().add(new THREE.Vector3((Math.random()-.5)*.8,(Math.random()-.5)*.5,(Math.random()-.5)*.8));btBeam(p1,p2,fromA?new THREE.Color(s.paint.glow).getHex():0xff5a5a)}}}
    else if(BT.done<ri){BT.done=ri;const before=btCounts(ri-1),after=D.rounds[ri];
      for(const side of['a','d'])for(const k of Object.keys(side==='a'?D.ia:D.id)){const init=(side==='a'?D.ia:D.id)[k]||0,aft=(after[side][k]||0);const units=BT.units.filter(x=>x.side===side&&x.k===k),alive=units.filter(x=>x.alive);const want=aft>0?Math.max(1,Math.round(units.length*aft/init)):0;
        let kill=alive.length-want;alive.sort(()=>Math.random()-.5);for(const x of alive){if(kill<=0)break;x.alive=false;kill--;const pos=x.m.position.clone();setTimeout(()=>{x.m.visible=false},120+Math.random()*500);btBoom(pos,x.k==='battleship'||x.k==='cruiser')}}
      btHud(ri)}}
  else if(ri>=R&&BT.done<R){BT.done=R;btHud(R-1)}
  BT.fx=BT.fx.filter(f=>{if(f.spin){f.spin.o.rotation[f.spin.ax]+=dt*f.spin.sp;return true}f.t+=dt;
    if(f.beam){f.beam.material.opacity=Math.max(0,1-f.t/.22);f.flash.material.opacity=f.beam.material.opacity;if(f.t>.22){BT.g.remove(f.beam);BT.g.remove(f.flash);f.beam.geometry.dispose();f.beam.material.dispose();f.flash.material.dispose();return false}return true}
    if(f.boom){const q=f.t/(f.big?1:.7);f.boom.scale.setScalar((f.big?7:4.5)*Math.min(1,q*2.2));f.boom.material.opacity=Math.max(0,1-q);const a=f.pts.geometry.attributes.position;for(let i=0;i<f.vel.length;i++){a.array[i*3]+=f.vel[i].x*dt;a.array[i*3+1]+=f.vel[i].y*dt;a.array[i*3+2]+=f.vel[i].z*dt}a.needsUpdate=true;f.pts.material.opacity=Math.max(0,1-f.t/1.4);
      if(f.t>1.4){BT.g.remove(f.boom);BT.g.remove(f.pts);f.boom.material.dispose();f.pts.geometry.dispose();f.pts.material.dispose();return false}return true}return false});
  if(BT.planet)BT.planet.rotation.y+=dt*.03;
  if(BT.comp)BT.comp.render();else BT.r.render(BT.scene,BT.cam)}
function btStart(){if(BT.running)return;BT.running=true;btSize();BT.last=performance.now();BT.raf=requestAnimationFrame(btLoop)}
function btStop(){if(!BT.running)return;BT.running=false;cancelAnimationFrame(BT.raf)}

// ---------- couche Supabase (même interface que la base d'origine) ----------
// Une seule table « docs » : path (clé), col (collection), data (jsonb), lease_holder / lease_exp (verrous courts).
let sb=null;
function sbInit(){const c=window.SUPABASE_CONFIG;if(!window.supabase||!c||!c.url||!c.key)return false;
  try{sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){console.error(e);return false}}
const pcolOf=path=>path.split('/').slice(0,-1).join('/');
const dsnap=(path,row)=>({id:path.split('/').pop(),exists:!!(row&&row.data),data:()=>row&&row.data?row.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}});
const sbErr=e=>{if(!e)return;const x=new Error(e.message||'Erreur base de données');x.code=(e.code==='42501'||/row-level security|permission/i.test(e.message||''))?'invalid_argument':'unavailable';throw x};
// diffusion temps réel : un seul canal pour toute la table, réparti par collection
const RT={listeners:new Map(),ch:null};
function rtStart(){if(RT.ch)return;RT.ch=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const path=(p.new&&p.new.path)||(p.old&&p.old.path);if(!path)return;const col=pcolOf(path);const ls=RT.listeners.get(col);if(!ls)return;
    for(const l of ls)l.apply(p.eventType==='DELETE'?{path,row:null}:{path,row:p.new})}).subscribe(st=>{if(st==='SUBSCRIBED')for(const ls of RT.listeners.values())for(const l of ls)l.resync()})}
function docRef(path){return{id:path.split('/').pop(),path,
  async get(){const{data,error}=await sb.from('docs').select('path,data').eq('path',path).maybeSingle();sbErr(error);return dsnap(path,data)},
  async set(d){const{error}=await sb.from('docs').upsert({path,col:pcolOf(path),data:d,updated_at:new Date().toISOString()},{onConflict:'path'});sbErr(error)},
  async update(d){const cur=await this.get();if(!cur.exists){const x=new Error('Document introuvable');x.code='invalid_argument';throw x}await this.set({...cur.data(),...d})},
  async delete(){const{error}=await sb.from('docs').delete().eq('path',path);sbErr(error)},
  async acquire({holder,ttlMs=30000}){const{data,error}=await sb.rpc('acquire_lease',{p_path:path,p_holder:holder,p_ttl_ms:Math.max(1000,ttlMs)});sbErr(error);return{acquired:!!data}},
  onSnapshot(n,e){let row=null;const l={apply:({row:r})=>{row=r;n(dsnap(path,row))},resync:async()=>{try{const s=await docRef(path).get();n(s)}catch(x){e&&e(x)}}};
    const col=pcolOf(path);if(!RT.listeners.has(col))RT.listeners.set(col,new Set());const filt={apply:x=>{if(x.path===path)l.apply(x)},resync:l.resync};RT.listeners.get(col).add(filt);rtStart();l.resync();return()=>RT.listeners.get(col).delete(filt)},
  collection:p=>colRef(path+'/'+p)}}
function colRef(path,q={}){return{path,
  doc:id=>docRef(path+'/'+(id||newId())),
  add:async d=>{const r=docRef(path+'/'+newId());await r.set(d);return r},
  where:(f,op,v)=>colRef(path,{...q,where:[...(q.where||[]),[f,op,v]]}),
  orderBy:(f,dir='asc')=>colRef(path,{...q,order:[f,dir]}),
  limit:n=>colRef(path,{...q,limit:n}),
  _match(d){return(q.where||[]).every(([f,op,v])=>{const x=d[f];return op==='array-contains'?Array.isArray(x)&&x.includes(v):op==='=='?x===v:op==='!='?x!==v:op==='<'?x<v:op==='<='?x<=v:op==='>'?x>v:op==='>='?x>=v:op==='in'?v.includes(x):op==='not-in'?!v.includes(x):true})},
  _out(map){let docs=[...map.entries()].filter(([,d])=>d&&this._match(d)).map(([p,d])=>dsnap(p,{data:d}));
    if(q.order){const[f,dir]=q.order,s=dir==='desc'?-1:1;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return(x>y?1:x<y?-1:0)*s})}if(q.limit)docs=docs.slice(0,q.limit);
    return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}},
  async _fetch(){let qq=sb.from('docs').select('path,data').eq('col',path).not('data','is',null);for(const[f,op,v]of q.where||[])if(op==='array-contains')qq=qq.contains('data->'+f,JSON.stringify([v]));
    const all=new Map();for(let from=0;;from+=1000){const{data,error}=await qq.range(from,from+999);sbErr(error);for(const r of data)all.set(r.path,r.data);if(data.length<1000)break}return all},
  async get(){return this._out(await this._fetch())},
  onSnapshot(n,e){let map=new Map(),t=null;const emit=()=>{clearTimeout(t);t=setTimeout(()=>n(this._out(map)),40)};
    const l={apply:({path:p,row})=>{if(row&&row.data)map.set(p,row.data);else map.delete(p);emit()},resync:async()=>{try{map=await this._fetch();n(this._out(map))}catch(x){console.error(x);e&&e(x)}}};
    if(!RT.listeners.has(path))RT.listeners.set(path,new Set());RT.listeners.get(path).add(l);rtStart();l.resync();const iv=setInterval(l.resync,45000);
    return()=>{clearInterval(iv);RT.listeners.get(path).delete(l)}}}}
const DBA={doc:docRef,collection:colRef};

// ---------- connexion : pseudo + mot de passe ----------
const slugPseudo=p=>p.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]/g,'');
const pseudoMail=p=>`${slugPseudo(p)}@joueurs.couronne-orion.app`;
function authMsg(e){const m=(e&&(e.message||e.code))||'';
  if(/invalid login|invalid_credentials/i.test(m))return'Pseudo ou mot de passe incorrect.';
  if(/already registered|already exists|user_already_exists/i.test(m))return'Ce pseudo est déjà pris.';
  if(/password should be at least|weak_password/i.test(m))return'Le mot de passe doit faire au moins 6 caractères.';
  if(/email not confirmed/i.test(m))return'Compte non confirmé : désactive « Confirm email » dans Supabase (Authentication → Sign In / Providers → Email).';
  if(/rate limit|too many/i.test(m))return'Trop d’essais. Patiente quelques minutes.';
  if(/fetch|network/i.test(m))return'Pas de connexion internet.';return'Erreur : '+m}
let loginMode='in';
function showLogin(msg){top_.hidden=true;tabsEl.hidden=true;v3Sync(false);hgSync(false);mpel.hidden=true;
  main.innerHTML=`<div class="join"><div class="hero">Couronne <span>d'Orion</span></div><p class="lead">Un univers de ${GALS.length} galaxies à conquérir entre amis.</p>
    <div class="card" style="display:grid;gap:12px"><div class="chips"><button class="chip" data-act="lmode" data-m="in" aria-pressed="${loginMode==='in'}">Se connecter</button><button class="chip" data-act="lmode" data-m="up" aria-pressed="${loginMode==='up'}">Créer un compte</button></div>
      <form id="loginf" style="display:grid;gap:10px" autocomplete="on">
        <label for="lpseudo"><h2>Pseudo</h2></label><input id="lpseudo" name="username" autocomplete="username" maxlength="20" autocapitalize="none" placeholder="Ex. vega42" value="${esc((()=>{try{return localStorage.getItem('orion-pseudo')||''}catch(e){return''}})())}">
        <label for="lpass"><h2>Mot de passe</h2></label><input id="lpass" type="password" name="password" autocomplete="${loginMode==='up'?'new-password':'current-password'}" minlength="6" placeholder="6 caractères minimum">
        ${loginMode==='up'?'<label for="lpass2"><h2>Confirme le mot de passe</h2></label><input id="lpass2" type="password" autocomplete="new-password" minlength="6">':''}
        <p id="lerr" class="eff" style="margin:0;color:var(--bad)">${msg?esc(msg):''}</p>
        <div><button class="btn" type="submit">${loginMode==='up'?'Créer mon compte':'Entrer dans la galaxie'}</button></div>
      </form>
      <p class="meta" style="margin:0">${loginMode==='up'?'Ton pseudo est unique. Note bien ton mot de passe : il n’y a pas de récupération automatique.':'Mot de passe oublié ? Demande à l’hôte du jeu de réinitialiser ton compte.'}</p></div></div>`;
  document.getElementById('loginf').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('lpseudo').value,pw=document.getElementById('lpass').value,er=document.getElementById('lerr');
    const s=slugPseudo(p);if(s.length<3)return er.textContent='Le pseudo doit contenir au moins 3 lettres ou chiffres.';if(pw.length<6)return er.textContent='Le mot de passe doit faire au moins 6 caractères.';
    if(loginMode==='up'&&pw!==document.getElementById('lpass2').value)return er.textContent='Les deux mots de passe ne correspondent pas.';
    er.textContent='Connexion…';try{localStorage.setItem('orion-pseudo',p.trim())}catch(x){}
    const r=loginMode==='up'?await sb.auth.signUp({email:pseudoMail(p),password:pw}):await sb.auth.signInWithPassword({email:pseudoMail(p),password:pw});
    if(r.error)return er.textContent=authMsg(r.error);
    if(loginMode==='up'&&!r.data.session)er.textContent=authMsg({message:'email not confirmed'})})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='lmode'){loginMode=b.dataset.m;showLogin()}
  if(b.dataset.act==='logout'){sb&&sb.auth.signOut().then(()=>location.reload())}});

// ---------- démarrage ----------
let started=false;
function boot(){
  if(!sbInit()){S.nodb=true;render();return}
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user;
    if(!u){if(started&&ev==='SIGNED_OUT')location.reload();else if(!started)showLogin();return}
    if(started)return;ME=u.id;try{const ps=localStorage.getItem('orion-pseudo');if(ps)S.pseudo=ps}catch(e){}if(!S.pseudo)S.pseudo=(u.email||'').split('@')[0];setTimeout(startGame,0)})}
function startGame(){if(started)return;started=true;db=DBA;main.innerHTML='<div class="join"><div class="hero">Couronne <span>d\'Orion</span></div><p class="lead">Connexion à la galaxie…</p></div>';
  const seen={p:0,pl:0,f:0,r:0};const ready=k=>{if(!seen[k]){seen[k]=1;S.ready++}render()};
  const fail=e=>{console.error(e);if(e&&e.code==='invalid_argument'){S.nodb=true;S.nodbMsg='Accès refusé par la base de données. Vérifie que le script SQL a bien été exécuté dans Supabase.';render()}};
  db.collection('planets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='planet'&&x.pid)o[x.pid]=x}S.planets=o;ready('p')},fail);
  db.collection('players').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='player')o[x.uid]=x}S.players=o;ready('pl')},fail);
  db.collection('fleets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='fleet')o[x.fid]=x}S.fleets=o;ready('f')},fail);
  db.collection('events').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='event')o[x.id]=x}S.events=o;if(S.ready>=3)render()},fail);
  db.collection('reports').where('to','array-contains',ME).orderBy('at','desc').limit(60).onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.kind==='report');reportSounds();if(S.ready>=3)render()},fail);
  setInterval(tick,1000);
}
boot();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
