  const mine=Object.values(S.planets).filter(p=>p.owner&&PLANETS[p.pid]),others=[],ex=[...new Set(Object.values(S.players).flatMap(p=>(p&&p.explored)||[]))],sig=mine.map(p=>p.pid).join()+'|'+ex.length+'|'+others.map(p=>p.pid).join();
  if(sig===VISC.sig&&VISC.set)return VISC.set;const set=new Set(ex);
  for(const p of mine){const s0=SYSTEMS[PLANETS[p.pid].sys],R=isBody(p.pid)?VIS_R_OUT:VIS_R;set.add(s0.i);for(const s of SYS_BY_GAL[s0.gal])if(Math.hypot(s.w[0]-s0.w[0],s.w[1]-s0.w[1],s.w[2]-s0.w[2])<=R)set.add(s.i)}

let AVIS={sig:'',set:null};
function allVisible(){const sig=Object.values(S.planets).filter(p=>p.owner).map(p=>p.pid).join()+'|'+Object.values(S.players).map(p=>(p.explored||[]).length).join();
  if(sig===AVIS.sig&&AVIS.set)return AVIS.set;const set=new Set();for(const pl of Object.values(S.players))for(const i of pl.explored||[])set.add(i);
  for(const p of Object.values(S.planets))if(p.owner&&PLANETS[p.pid]){const s0=SYSTEMS[PLANETS[p.pid].sys],R=isBody(p.pid)?VIS_R_OUT:VIS_R;set.add(s0.i);for(const s of SYS_BY_GAL[s0.gal])if(Math.hypot(s.w[0]-s0.w[0],s.w[1]-s0.w[1],s.w[2]-s0.w[2])<=R)set.add(s.i)}
  AVIS={sig,set};return set}
const inFog=i=>!(SYSTEMS[i]&&SYSTEMS[i].deep)&&!allVisible().has(i);

// ---------- flottes en position et embuscades ----------
const AMB_INT=20*60e3,AMB_INT_FOG=10*60e3;
async function holdAt(f,fref,ships,cargo,extra={}){if(isEmpty(ships)){await fref.delete();if(f.cmd)await killCmd(f.owner,f.cmd);return}
  if(f.autoBack&&f.mission!=='reinforce'&&!extra.stay)return goBack(f,fref,ships,cargo,extra); // retour automatique demandé à l'envoi
  if(f.cmd&&(f.ships||{}).flag&&!(ships||{}).flag){await killCmd(f.owner,f.cmd,'flag');f={...f,cmd:null}}
  let home=f.home||f.from;if(f.phase!=='battle'&&f.to!==home&&bayRoomFor(f.to,f.owner,ships))home=f.to; // après une bataille, la flotte garde sa planète d'attache (pas de changement silencieux)
   // en orbite d'une de tes planètes avec de la place : elle y est rattachée
  await fref.set({...f,...extra,ships,cargo,phase:'hold',holdAt:f.arrive,lastAmb:f.arrive,amb:0,home,group:null})}
function sysPacksAlive(si){const s=SYSTEMS[si];if(!s)return[];return[s.lair,...(s.packs||[])].filter(pid=>{const st=raidState(pid);return!st.done&&!st.absent&&worth(st.garrison)>0})}
function ambushNext(f){const m=PLANETS[f.to];if(!m||!sysPacksAlive(m.sys).length)return null;if(f.mission==='reinforce'||(S.planets[f.to]&&S.planets[f.to].owner))return null; // en orbite d'une planète habitée : la flotte défend avec elle
  return(f.lastAmb||f.holdAt||Date.now())+(inFog(m.sys)?AMB_INT_FOG:AMB_INT)*cmdAmb(f.owner,f.cmd)}
async function ambush(f,fref){const si=PLANETS[f.to].sys,alive=sysPacksAlive(si),now=Date.now();if(!alive.length){await fref.set({...f,lastAmb:now});return}
  const n=(f.amb||0)+1,chance=Math.min(.9,.35+.15*Math.floor((now-(f.holdAt||now))/AMB_INT)),roll=(hash(f.fid+':'+n)%1000)/1000;
  if(roll>chance){await fref.set({...f,lastAmb:now,amb:n});return}

  if(R.lair){const L=lairInfoAt(SYSTEMS[R.sys],now);born=L?L.founded:now}else if(R.local)born=packBorn(ev);else born=R.start||now;born=Math.max(born,CMD_EPOCH);
  const h=Math.max(0,(now-born)/HR);
  if(R.boss)return{n:HOLES[R.gate].boss,L:Math.min(12,2+R.gate*2+Math.floor(h/6))};
  return{n:ECU_N[hash(pid+'c'+Math.floor(born/HR))%ECU_N.length],L:Math.min(8,(R.tier||0)+Math.floor(h/8))}}
const raidMods=pid=>{const c=raidCmd(pid);return applyCmd(modsOf(null),c?c.L:0)};
const raidCmdTxt=pid=>{const c=raidCmd(pid);return c?`Commandant ${esc(c.n)} · niv. ${c.L}`:''};

// ---------- défenses avancées ----------
const shieldRed=L=>Math.min(.4,.05*(L||0));
const minePct=L=>Math.min(30,3*(L||0));
function applyShield(m,L){const r=shieldRed(L);if(!r)return m;const o={};for(const k in m)o[k]={...m[k],red:1-(1-m[k].red)*(1-r)};return o}
const planetMods=p=>{const m=applyShield(p.owner&&!isNpc(p.owner)?forceMods(p.owner,(planetCmd(p.owner,p.pid)||{}).id):modsOf(p.owner),p.lv&&p.lv.shld);if(!p.owner||!PLANETS[p.pid]||sysLord(PLANETS[p.pid].sys)!==p.owner)return m;const o={};for(const k in m)o[k]={...m[k],hp:m[k].hp*1.1};return o}; // seigneur du système : +10 % de résistance
// les mines frappent chaque flotte qui entre en orbite d’une planète ennemie
function hitMines(ships,L,mul=1){const pc=Math.min(.9,minePct(L)/100*mul),lost={};if(!pc)return lost;for(const k of['fighter','cruiser','battleship']){const n=Math.floor((ships[k]||0)*(k==='battleship'?pc/2:pc));if(n>0){lost[k]=n;ships[k]-=n}}return lost}

// ---------- batailles longues ----------
const LB_MIN=120,LB_TICK=20000,LB_MAXR=24,LB_DMG=.45;
const btId=pid=>'bt-'+pid;
const activeBattle=pid=>{const e=S.events[btId(pid)];return e&&e.battle&&!e.done?e:null};
const sumShips=list=>{const t={};for(const s of list)for(const k in s||{})if(s[k]>0)t[k]=(t[k]||0)+s[k];return t};
function splitSurv(list,after){const tot=sumShips(list),surv=list.map(()=>zeroShips());
  for(const k in tot){const before=tot[k],aft=Math.min(before,after[k]||0);let rem=aft;const sh=list.map((s,i)=>({i,n:(s&&s[k])||0}));sh.forEach(s=>{const v=Math.floor(aft*s.n/before);surv[s.i][k]=v;rem-=v});sh.sort((a,b)=>b.n-a.n);for(let q=0;rem>0&&q<sh.length*2;q++){const s=sh[q%sh.length];if(surv[s.i][k]<s.n){surv[s.i][k]++;rem--}}}
  return surv}
const entryOf=x=>({fid:x.f?x.f.fid:x.fid,owner:x.owner,cmd:(x.f?x.f.cmd:x.cmd)||null,ships:{...x.ships},ships0:{...x.ships},w:worth(x.ships)});
// démarre une bataille longue (appelé sous le verrou de la planète)
async function startBattle(f,forces,p,tn,guards=[]){const now=Date.now(),id=btId(f.to);let ok=false;
  await locked('events/'+id,async(ev,eref)=>{if(ev&&ev.battle&&!ev.done)return;
    const att=forces.map(entryOf),home={...p.ships},tur=(p.lv.def||0)*4;
    await eref.set({kind:'event',id,battle:true,pid:f.to,owner:p.owner,start:now,next:now+8000,rounds:0,att,dal:guards.map(entryOf),tur,home,iA:sumShips(att.map(x=>x.ships)),iD:{...sumShips([home,...guards.map(g=>g.ships)]),turret:tur},hw:worth(home)+tur*VALUE.turret,snaps:[],kA:0,kD:0,done:false});ok=true});
  if(!ok)return false;
  for(const x of forces)await x.ref.set({...x.f,ships:x.ships,phase:'battle',bt:id});for(const g of guards)await g.ref.set({...g.f,phase:'battle',bt:id});
  const atkUids=[...new Set(forces.map(x=>x.owner))];
  await report({to:[...new Set([...allPlayers()])],tone:'info',title:`Grande bataille engagée à ${tn}`,lines:[`${atkUids.map(pname).join(', ')} contre ${pname(p.owner)}.`,`La bataille dure jusqu’à ${Math.round(LB_MAXR*LB_TICK/60000)} minutes, un échange toutes les ${LB_TICK/1000} secondes. Envoie des renforts (mission « Renfort » pour défendre, « Attaque » pour assaillir) depuis l’onglet Flottes.`]});
  return true}
// une flotte rejoint une bataille en cours ; renvoie true si elle a été absorbée
async function joinBattle(f,fref,side,minesL){let joined=false,lost={};const id=btId(f.to);
  await locked('events/'+id,async(ev,eref)=>{if(!ev||!ev.battle||ev.done)return;const ships={...f.ships};if(side==='att'&&minesL)lost=hitMines(ships,minesL);const e=entryOf({fid:f.fid,owner:f.owner,cmd:f.cmd,ships});
    if(side==='att'){ev.att.push(e);ev.iA=sumShips([ev.iA,ships])}else{ev.dal.push(e);ev.iD=sumShips([ev.iD,ships])}await eref.set(ev);joined=true;
    await fref.set({...f,ships,phase:'battle',bt:id})});
  if(joined)await report({to:[f.owner],tone:'info',title:`Ta flotte entre dans la bataille de ${plName(f.to)}`,lines:[`${side==='att'?'Côté attaquants':'Côté défenseurs'} · ${unitLine(f.ships)}.`,...(count(lost)?[`Champ de mines : ${unitLine(lost)} détruits en entrant en orbite.`]:[])]});
  return joined}
async function battleTicks(){const now=Date.now();for(const e of Object.values(S.events)){if(!e.battle||e.done||e.next>now||busy.has(e.id))continue;busy.add(e.id);
  try{await locked('events/'+e.id,async(ev,eref)=>{if(!ev||ev.done||ev.next>Date.now())return;await battleRound(ev,eref)})}catch(x){console.error(x)}finally{busy.delete(e.id)}}}
async function battleRound(e,eref){const now=Date.now(),tn=plName(e.pid),reps=[];
  await locked('planets/'+e.pid,async(d,ref)=>{const p=d&&d.owner?settle(d,now):null,mine=p&&p.owner===e.owner;
    const home=mine?{fighter:p.ships.fighter||0,cruiser:p.ships.cruiser||0,battleship:p.ships.battleship||0,colony:p.ships.colony||0,probe:p.ships.probe||0}:zeroShips();
    const A=e.att,D=[{owner:e.owner,ships:home},...e.dal],tA=sumShips(A.map(x=>x.ships)),tDs=sumShips(D.map(x=>x.ships)),tD={...tDs,...(e.tur>0?{turret:e.tur}:{})};
    let ended=isEmpty(tA)||isEmpty(tD),B=null;
    if(!ended){const ctx=vsPirates(e.owner,...A.map(x=>x.owner),...e.dal.map(x=>x.owner))?'raid':null,ma=withCtx(ctx,()=>avgMods(A)),md=withCtx(ctx,()=>mine?defMods(p,{...home,turret:e.tur||0},e.dal):applyShield(avgMods(D),0));B=battle(tA,tD,ma,md,1,LB_DMG);
      const sA=splitSurv(A.map(x=>x.ships),B.a),sD=splitSurv(D.map(x=>x.ships),B.d);
      A.forEach((x,i)=>x.ships=sA[i]);e.dal.forEach((x,i)=>x.ships=sD[i+1]);
      if(mine){for(const k of SK)p.ships[k]=sD[0][k]||0;await ref.set(p)}
      e.kA+=worth(tD)-worth(B.d);e.kD+=worth(tA)-worth(B.a);e.tur=B.d.turret||0;e.home=sD[0];e.rounds++;e.snaps=[...e.snaps,{a:{...B.a},d:{...B.d}}].slice(-40);e.next=now+LB_TICK;
      ended=isEmpty(B.a)||isEmpty(B.d)||e.rounds>=LB_MAXR}
    if(!ended){await eref.set(e);return}
    // fin de la bataille
    const fa=sumShips(A.map(x=>x.ships)),fd={...sumShips([e.home,...e.dal.map(x=>x.ships)]),...(e.tur>0?{turret:e.tur}:{})},won=isEmpty(fd)&&!isEmpty(fa),body=isBody(e.pid);
    let loots=A.map(()=>({m:0,c:0,f:0})),annex=-1;
    if(won&&p&&mine&&!body){loots=splitLoot({m:p.res.m/2,c:p.res.c/2,f:p.res.f/2},A.map(x=>x.ships),shares(A));const t=sumLoot(loots);for(const k in RES)p.res[k]-=t[k]}
    if(won&&p&&mine&&!p.capital){const i=A.findIndex(x=>(x.ships.colony||0)>0);if(i>=0){const o=A[i].owner,lim=body?outpostsOf(o)<MAXO:planetsOf(o)<MAXP;if(lim&&(body||await payCulture(o))){annex=i;if(body){await settleRare(e.owner);await settleRare(o)}
      const sh={...A[i].ships};sh.colony--;p.owner=o;p.build=null;p.bq=[];p.shipQ=[];p.armQ=[];p.ships={...zeroShips(),...sh};if(!body)addRes(p.res,loots[i]);p.capital=false}}}
    const npcTook=won&&p&&mine&&!p.capital&&annex<0&&A.every(x=>isNpc(x.owner))&&A.some(x=>(S.fleets[x.fid]||{}).conquer);
    if(npcTook)await ref.set({kind:'planet',pid:e.pid,owner:null,garrison:sumShips(A.map(x=>x.ships)),pill:true});else if(p)await ref.set(p);
    for(let i=0;i<A.length;i++){const x=A[i];await locked('fleets/'+x.fid,async(fl,fref)=>{if(!fl||fl.phase!=='battle')return;if(i===annex||isNpc(x.owner)){await fref.delete();return}await holdAt({...fl,arrive:now},fref,x.ships,loots[i])}).catch(()=>{})}
    for(const x of e.dal)await locked('fleets/'+x.fid,async(fl,fref)=>{if(!fl||fl.phase!=='battle')return;await holdAt({...fl,arrive:now},fref,x.ships,fl.cargo||{m:0,c:0,f:0})}).catch(()=>{});
    const WA=A.reduce((t,x)=>t+x.w,0)||1,WD=(e.hw||0)+e.dal.reduce((t,x)=>t+x.w,0)||1;
    await award(A.map(x=>({uid:x.owner,cmd:x.cmd,v:e.kA*x.w/WA})),`grande bataille de ${tn}`);await award([{uid:e.owner,cmd:(planetCmd(e.owner,e.pid)||{}).id,v:e.kD*(e.hw||0)/WD},...e.dal.map(x=>({uid:x.owner,cmd:x.cmd,v:e.kD*x.w/WD}))],`défense de ${tn}`);
    const atkU=[...new Set(A.map(x=>x.owner))],defU=[...new Set([e.owner,...e.dal.map(x=>x.owner)])],dur=fmtDur((now-e.start)/1000);
    for(const u of(won?atkU:defU))if(!isNpc(u)&&Math.random()<.6)await giveChest(u,'b');
    const cmdL=[...A,...e.dal].filter(x=>x.cmd).map(x=>{const c=cmdById(x.owner,x.cmd);return c?`${cmdInfo(c).n} (${pname(x.owner)})`:null}).filter(Boolean);
    const lines=[...(cmdL.length?[`🎖 Commandants engagés : ${cmdL.join(', ')}.`]:[]),`Durée : ${dur} · ${e.rounds} échanges${e.dal.length?` · ${e.dal.length} renfort${e.dal.length>1?'s':''} en défense`:''}${A.length>1?` · ${A.length} flottes à l’attaque`:''}.`,
      `Attaque : ${unitLine(e.iA)} — pertes : ${lossLine(e.iA,fa)}.`,`Défense : ${unitLine(e.iD)} — pertes : ${lossLine(e.iD,fd)}.`,
      `Points de combat : ${Math.round(e.kA)} pour l’attaque, ${Math.round(e.kD)} pour la défense.`,
      ...(won&&!body?[`Butin : ${lootTxt(sumLoot(loots))}.`]:[]),...(annex>=0?[`${tn} passe sous le contrôle de ${pname(A[annex].owner)}.`]:[]),...(npcTook?[`${tn} est tombée aux mains des Pillards du Néant : reprends-la avec un vaisseau colon.`]:[]),
      ...(!won&&!isEmpty(fa)?['Le temps est écoulé : les attaquants restent en position autour de la planète.']:[])];
    e.done=true;e.doneAt=now;e.won=won;await eref.set(e);
    reps.push({news:annex>=0||npcTook?['battle','conquest']:'battle',to:[...new Set([...atkU,...defU])],tone:won?'win':'loss',loser:won?e.owner:atkU[0],title:won?`${atkU.map(pname).join(', ')} ${atkU.length>1?'remportent':'remporte'} la grande bataille de ${tn}`:`${pname(e.owner)} tient ${tn}`,lines,
      intel:(()=>{const rem={};for(const k in e.iD){if(k==='turret')continue;const v=Math.max(0,(fd||{})[k]||0);if(v)rem[k]=v}return{pid:e.pid,at:Date.now()+1000,owner:annex>=0?A[annex].owner:e.owner,ships:rem,turrets:(e.iD||{}).turret||0,after:true}})(),
      battle:{ia:e.iA,id:e.iD,rounds:e.snaps,att:A.map(x=>({uid:x.owner,ships:x.ships0,ck:(cmdById(x.owner,x.cmd)||{}).key||null})),def:e.owner,pid:e.pid,planet:true}})});
  for(const r of reps)await report(r)}
async function retreatBattle(fid){await act(async()=>{const f=S.fleets[fid];if(!f||f.owner!==ME||f.phase!=='battle')throw err('Cette flotte n’est plus au combat.');let ent=null;
  await locked('events/'+f.bt,async(ev,eref)=>{if(!ev||ev.done)return;for(const side of['att','dal']){const i=ev[side].findIndex(x=>x.fid===fid);if(i>=0){ent=ev[side][i];ev[side].splice(i,1)}}if(!ent)return;if(!ev.att.length)ev.next=Date.now();await eref.set(ev)});
  await locked('fleets/'+fid,async(fl,fref)=>{if(!fl||fl.phase!=='battle')throw err('Cette flotte n’est plus au combat.');const ships=ent?ent.ships:fl.ships;if(isEmpty(ships)){await fref.delete();return}
    const home=fl.home||fl.from,now=Date.now(),eta=etaOf(fl.to,home,ships),cg=fl.cargo||{m:0,c:0,f:0};await fref.set({...fl,ships,from:home,phase:'back',arrive:now,depart:now-eta*1000,back:now+eta*1000,bt:null,cargo:{m:Math.floor(cg.m*.7),c:Math.floor(cg.c*.7),f:Math.floor(cg.f*.7)}})});
  sfx.launch();toast('Retraite ordonnée : ta flotte rentre.')})}

async function reinforceArrival(f,fref){if(await joinBattle(f,fref,'dal',0))return;const o=S.planets[f.to]&&S.planets[f.to].owner;await holdAt(f,fref,f.ships,f.cargo);

  else if(o===f.owner)await report({to:[f.owner],tone:'info',title:`Ta flotte soutient ${plName(f.to)}`,lines:['Elle reste en orbite et défend la planète avec ses défenses. Elle reste rattachée à sa planète d’origine : depuis l’onglet Flottes, tu peux la faire rentrer ou lui donner une nouvelle mission.']});

// ---------- commerce entre joueurs ----------
const TRK={m:'Métal',c:'Cristal',f:'Hélium-3',ir:'Iridium',xe:'Xénite',am:'Antimatière'};
const isRareK=k=>k in RARE;const TRADE_K=['m','c','f'];
const tradeOpen=()=>Object.values(S.events).filter(e=>e.trade&&e.status==='open').sort((a,b)=>b.at-a.at);
async function takeGoods(uid,pid,k,n){if(isRareK(k))await withPlayer(uid,d=>{if((d.rare[k]||0)<n)throw err(`${TRK[k]} insuffisant.`);d.rare[k]-=n});
  else await locked('planets/'+pid,async(d,ref)=>{if(!d||d.owner!==uid)throw err('Planète perdue.');const p=settle(d,Date.now());if((p.res[k]||0)<n)throw err(`${TRK[k]} insuffisant sur ${plName(pid)}.`);p.res[k]-=n;await ref.set(p)})}
async function giveGoods(uid,pid,goods){const res={m:0,c:0,f:0},rare={};let any=false;for(const k in goods){if(isRareK(k))rare[k]=goods[k];else{res[k]=goods[k];any=true}}
  if(Object.keys(rare).length&&S.players[uid])await withPlayer(uid,d=>{for(const k in rare)d.rare[k]=(d.rare[k]||0)+rare[k]}).catch(()=>{});
  if(any){let dest=pid;const o=S.planets[dest];if(!o||o.owner!==uid||isBody(dest)){const c=capitalOf(uid);dest=c&&c.pid}if(dest)await locked('planets/'+dest,async(d,ref)=>{if(!d||d.owner!==uid)return;const p=settle(d,Date.now());addRes(p.res,res);await ref.set(p)}).catch(()=>{})}}
async function tradeCreate(){await act(async()=>{const g=document.getElementById('trgk').value,gn=Math.floor(+document.getElementById('trgn').value||0),w=document.getElementById('trwk').value,wn=Math.floor(+document.getElementById('trwn').value||0);
  if(!TRADE_K.includes(g)||!TRADE_K.includes(w))throw err('Les minerais rares ne s’échangent pas.');if(gn<1||wn<1)throw err('Indique des quantités.');if(g===w)throw err('Choisis deux ressources différentes.');const pid=S.sel;if(isBody(pid))throw err('Le commerce part d’une planète, pas d’un avant-poste.');
  if(tradeOpen().filter(e=>e.seller===ME).length>=4)throw err('4 offres ouvertes au maximum.');
  await takeGoods(ME,pid,g,gn);const id='tr-'+newId();await db.doc('events/'+id).set({kind:'event',id,trade:true,seller:ME,pid,give:{[g]:gn},want:{[w]:wn},status:'open',at:Date.now()});sfx.build();toast('Offre publiée au marché.')})}

async function interceptAttack(f,fref){const waiters=[];for(const w of Object.values(S.fleets)){if(w.phase!=='wait'||w.target!==f.fid)continue;try{await locked('fleets/'+w.fid,async(wd,wref)=>{if(wd&&wd.phase==='wait'&&wd.target===f.fid)waiters.push({f:wd,ref:wref,owner:wd.owner,ships:wd.ships})})}catch(e){}}

  const G=withCtx(isNpc(f.owner)?'raid':null,()=>groupFight(waiters,{...f.ships},forceMods(f.owner,f.cmd))),left=G.B.d,sh=shares(waiters);

  await award([...waiters.map((x,i)=>({uid:x.owner,cmd:x.f.cmd,v:(worth(G.B.id)-worth(left))*sh[i]})),...(isNpc(f.owner)?[]:[{uid:f.owner,cmd:f.cmd,v:worth(G.B.ia)-worth(G.B.a)}])],`interception devant ${tn}`);
  const stopped=isEmpty(left),who=[...new Set(waiters.map(x=>pname(x.owner)))].join(', ');
  const lines=[`Intercepteurs (${who}) : ${unitLine(G.B.ia)} — pertes : ${lossLine(G.B.ia,G.B.a)}.`,`Flotte de ${atkName} : ${unitLine(G.B.id)} — pertes : ${lossLine(G.B.id,left)}.`,stopped?'L’attaque est stoppée avant d’atteindre la planète.':`Il reste ${unitLine(left)} : l’attaque continue sur ${tn}. Les intercepteurs survivants rentrent à leur base.`];
  const owner=S.planets[f.to]&&S.planets[f.to].owner,to=[...new Set([...waiters.map(x=>x.owner),owner,isNpc(f.owner)?null:f.owner].filter(Boolean))];
  await report({to,tone:stopped?'win':'info',loser:stopped?f.owner:null,title:stopped?`Attaque interceptée avant ${tn}`:`Interception devant ${tn}`,lines});
  if(stopped){await fref.delete();if(f.cmd)await killCmd(f.owner,f.cmd);return null}
  let nf={...f,ships:left};if(f.cmd&&!(left.flag>0)){await killCmd(f.owner,f.cmd,'flag');nf.cmd=null}await fref.set(nf);return nf}

const LLOCK=new Map();
async function locked(path,fn){const prev=LLOCK.get(path)||Promise.resolve();let rel;const mine=new Promise(r=>rel=r),tail=prev.then(()=>mine);LLOCK.set(path,tail);

    if(r.acquired){const s=await ref.get();const d=s.exists?s.data():null;return await fn(d&&d.kind?clone(d):null,ref)}
    await sleep(250+Math.random()*600)}
  throw err('Cible occupée, réessaie dans un instant.')}

async function withPlayer(uid,fn){return locked('players/'+uid,async(d,ref)=>{if(!d)throw err('Empire introuvable.');const now=Date.now(),rt=rareRates(uid),dt=Math.max(0,(now-(d.rareAt||now))/60000);
  d.rare=d.rare||{};d.rareBy=d.rareBy||{};const rcap=rareCap(uid),bodies=Object.values(S.planets).filter(p=>p.owner===uid&&isBody(p.pid));
  for(const p of bodies){const x=rareRate(settle(p,now)),b=d.rareBy[p.pid]=d.rareBy[p.pid]||{},cp=bodyRareCap(p);for(const k in RARE)b[k]=Math.min(cp,rareFill(b[k]||0,x[k]*dt,cp))}for(const pid in d.rareBy)if(!bodies.some(p=>p.pid===pid))delete d.rareBy[pid];
  // migration : l'ancienne réserve commune venait des satellites → on la reverse dans leurs stocks
  if(!d.rareMig&&bodies.length){const w=bodies.map(p=>{const x=rareRate(settle(p,now));return Object.values(x).reduce((a,b)=>a+b,0)||1}),W=w.reduce((a,b)=>a+b,0);for(const k in RARE){const v=d.rare[k]||0;if(v>0){bodies.forEach((p,i)=>{d.rareBy[p.pid][k]=(d.rareBy[p.pid][k]||0)+v*w[i]/W});d.rare[k]=0}}d.rareMig=1}
  const central={...d.rare};for(const k in RARE){central[k]=central[k]||0;d.rare[k]=central[k]+bodies.reduce((t,p)=>t+(d.rareBy[p.pid][k]||0),0)} // pendant l'action, d.rare = total disponible
  d.culture=(d.culture??50)+cultureRate(uid)*dt;d.rareAt=now;const r0={...d.rare};
  if(d.research&&d.research.until<=now){d.tech=d.tech||{};d.tech[d.research.k]=(d.tech[d.research.k]||0)+1;d.research=null}
  const res=await fn(d);for(const k in RARE){const delta=(d.rare[k]||0)-r0[k];let c=central[k];
    if(delta>0){let g=delta;if(bodies.length){// gains (butin, coffres…) : rangés dans les stocks des satellites qui ont de la place
      for(const p of bodies.slice().sort((a,b)=>(bodyRareCap(b)-(d.rareBy[b.pid][k]||0))-(bodyRareCap(a)-(d.rareBy[a.pid][k]||0)))){if(g<=0)break;const bb=d.rareBy[p.pid],room=Math.max(0,bodyRareCap(p)-(bb[k]||0)),u=Math.min(room,g);bb[k]=(bb[k]||0)+u;g-=u}}
      else c=Math.max(c,Math.min(c+g,rcap))} // sans satellite : réserve de l'empire ; sinon le surplus au-delà des stocks est perdu
    else if(delta<0){let need=-delta;const t=Math.min(c,need);c-=t;need-=t;for(const p of bodies.slice().sort((a,b)=>(d.rareBy[b.pid][k]||0)-(d.rareBy[a.pid][k]||0))){if(need<=0)break;const bb=d.rareBy[p.pid],u=Math.min(bb[k]||0,need);bb[k]=(bb[k]||0)-u;need-=u}}
    d.rare[k]=c}
  await ref.set(d);return res})}

function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushSubscribe(quiet){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!sb||!ME)return false;const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();if(!sub){const r=await fetch(PUSH_FN()+'?key');const{pub}=await r.json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pub)})}
  const{error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,uid:ME,sub:sub.toJSON()});if(error)throw error;try{localStorage.setItem('orion-push-'+ME,'1')}catch(e){}return true}
  catch(e){console.error(e);if(!quiet)toast('Impossible d’activer les notifications sur cet appareil.','bad');return false}}
async function pushOff(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){console.error(e)}try{localStorage.setItem('orion-push-'+ME,'0')}catch(e){}if(navigator.clearAppBadge)navigator.clearAppBadge().catch(()=>{});toast('Alertes désactivées sur cet appareil.');render()}

  {const rs=S.players[ME].research;if(rs&&rs.until<=now)keys.push(['d','r'+rs.until,`Recherche terminée : ${WEAP[rs.k].n}.`]);const cm=cometAt(),hv=hiveAt();if(cm)keys.push(['d','cm'+cm.id,`Une grande comète traverse le système ${SYSTEMS[PLANETS[cm.pid].sys].name} (${GALS[galOf(cm.pid)].name}). Le premier qui la récolte gagne gros.`]);for(const c of myMiniComets())keys.push(['d','mc'+c.id,`☄ Une petite comète traverse ton système ${SYSTEMS[c.sys].name}. Récolte-la avant qu’elle ne disparaisse !`]);if(hv)keys.push(['a','hv'+hv.id,`La Ruche a surgi à ${PLANETS[hv.pid].name}. Unissez vos flottes pour l’abattre.`])}

  {const B={planet:[],yard:[],lab:[],news:[]};const j0=(S.players[ME]||{}).joined||0;for(const e of Object.values(S.events))if(e.news&&e.at>j0&&!(e.uids&&e.uids.length===1&&e.uids[0]===ME))B.news.push('n'+e.id);B.log=S.reports.filter(r=>(r.at||0)>Math.max(j0,LOG_EPOCH)).map(r=>'L'+r.id);if(!EV.newsInit){EV.newsInit=true;try{if(!localStorage.getItem('orion-ninit-'+ME)){const S0=bseen();B.news.forEach(k=>S0.add(k));localStorage.setItem('orion-bseen-'+ME,JSON.stringify([...S0].slice(-300)));localStorage.setItem('orion-ninit-'+ME,'1')}}catch(e){}}for(const[t,k]of keys){if(t!=='d')continue;const c=k[0];if(c==='b')B.planet.push(k);else if(c==='s')B.yard.push(k);else if(c==='m'||(c==='r'&&/^r\d/.test(k)))B.lab.push(k)}EV.badge=B}

const NZ=(()=>{const p=new Uint8Array(512),r=rng(7),a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)p[i]=a[i&255];
  const gr=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)};const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a);
  return(x,y,z)=>{const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z),X=fx&255,Y=fy&255,Z=fz&255;x-=fx;y-=fy;z-=fz;const u=fd(x),v=fd(y),w=fd(z);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lp(lp(lp(gr(p[AA],x,y,z),gr(p[BA],x-1,y,z),u),lp(gr(p[AB],x,y-1,z),gr(p[BB],x-1,y-1,z),u),v),lp(lp(gr(p[AA+1],x,y,z-1),gr(p[BA+1],x-1,y,z-1),u),lp(gr(p[AB+1],x,y-1,z-1),gr(p[BB+1],x-1,y-1,z-1),u),v),w)}})();
function fbm(x,y,z,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*NZ(x*f,y*f,z*f);f*=2.03;a*=.5}return s}

  vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',

  for(let i=0;i<34;i++){const cx=r()*W,cy=H*.5+(r()-.5)*H*.45,rad=100+r()*360,c=cols[Math.floor(r()*cols.length)],a0=.07+r()*.11;for(const ox of[-W,0,W]){const g2=x.createRadialGradient(cx+ox,cy,0,cx+ox,cy,rad);g2.addColorStop(0,`rgba(${c},${a0})`);g2.addColorStop(1,`rgba(${c},0)`);x.fillStyle=g2;x.fillRect(cx+ox-rad,cy-rad,rad*2,rad*2)}}
  for(let i=0;i<4200;i++){const big=r()<.025,yy=r()<.5?H*.5+(r()-.5)*H*.3:r()*H;x.fillStyle=`rgba(${215+r()*40|0},${215+r()*40|0},255,${r()*.7+.25})`;x.fillRect(r()*W,yy,big?2:1,big?2:1)}})}

  if(a==='iosgn'){e.stopPropagation();IG.i++;iosGuide()}else if(a==='iosgp'){e.stopPropagation();IG.i=Math.max(0,IG.i-1);iosGuide()}

async function doInstall(){if(INSTALL_EV){INSTALL_EV.prompt();try{const r=await INSTALL_EV.userChoice;if(r&&r.outcome==='accepted')INSTALL_EV=null}catch(e){}return}
  if(isIOS()&&!inAppBrowser()){IG.i=0;iosGuide();return}

  const ios=isIOS(),steps=inAppBrowser()?[`Ce lien s’est ouvert dans l’application de discussion. Touche le menu (⋯ ou ⋮) puis <b>Ouvrir dans ${ios?'Safari':'le navigateur'}</b>.`,'Recommence ensuite depuis ce bouton.']
    :ios?['Touche le bouton <b>Partager</b> (le carré avec une flèche ⬆ vers le haut), en bas de Safari.','Fais défiler et choisis <b>Sur l’écran d’accueil</b>.','Touche <b>Ajouter</b> : l’icône Couronne d’Orion apparaît sur ton écran d’accueil.']

  el.innerHTML=`<div class="scrim" data-act="instclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="Installer l’appli" data-stop="1"><h2 style="margin:0">📲 Installer Couronne d’Orion</h2><ol style="margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.45">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="eff" style="margin:0;font-size:12px">Lien à partager pour installer le jeu : <b style="user-select:all">${esc(location.origin+location.pathname)}#installer</b></p><div class="foot"><button class="btn ghost sm" data-act="instcopy">Copier le lien</button><button class="btn sm" data-act="instclose">Compris</button></div></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='install'){e.stopPropagation();doInstall()}

  else if(a==='instcopy'){const u=location.origin+location.pathname+'#installer';try{navigator.clipboard.writeText(u).then(()=>{try{toast('Lien copié.')}catch(x){}},()=>{})}catch(x){}}},true);
if(location.hash==='#installer'&&!isStandalone())setTimeout(doInstall,1200);
else if(isIOS()&&!isStandalone()&&!inAppBrowser()&&!installHidden()){let seen=false;try{seen=localStorage.getItem('orion-iosg')==='1'}catch(e){}if(!seen)setTimeout(()=>{if(!document.getElementById('iosg')||!document.getElementById('iosg').innerHTML){IG.i=0;iosGuide()}},2500)}
function showLogin(msg){top_.hidden=true;tabsEl.hidden=true;v3Sync(false);hgSync(false);mpel.hidden=true;
  main.innerHTML=`<div class="join"><div class="hero">Couronne <span>d'Orion</span></div><p class="lead">Un univers de ${GALS.length} galaxies à conquérir entre amis.</p>
    <div class="card" style="display:grid;gap:12px"><div class="chips"><button class="chip" data-act="lmode" data-m="in" aria-pressed="${loginMode==='in'}">Se connecter</button><button class="chip" data-act="lmode" data-m="up" aria-pressed="${loginMode==='up'}">Créer un compte</button></div>
      <form id="loginf" style="display:grid;gap:10px" autocomplete="on">
        <label for="lpseudo"><h2>Pseudo</h2></label><input id="lpseudo" name="username" autocomplete="username" maxlength="20" autocapitalize="none" placeholder="Ex. vega42" value="${esc((()=>{try{return localStorage.getItem('orion-pseudo')||''}catch(e){return''}})())}">
        <label for="lpass"><h2>Mot de passe</h2></label><input id="lpass" type="password" name="password" autocomplete="${loginMode==='up'?'new-password':'current-password'}" minlength="6" placeholder="6 caractères minimum">
        ${loginMode==='up'?'<label for="lpass2"><h2>Confirme le mot de passe</h2></label><input id="lpass2" type="password" autocomplete="new-password" minlength="6">':''}
        <p id="lerr" class="eff" style="margin:0;color:var(--bad)">${msg?esc(msg):''}</p>
        <div><button class="btn" type="submit">${loginMode==='up'?'Créer mon compte':'Entrer dans la galaxie'}</button></div>
      </form>
      ${installBanner()}<p class="meta" style="margin:0">${loginMode==='up'?'Ton pseudo est unique. Note bien ton mot de passe : il n’y a pas de récupération automatique.':'Mot de passe oublié ? Demande à l’hôte du jeu de réinitialiser ton compte.'}</p></div></div>`;
  document.getElementById('loginf').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('lpseudo').value,pw=document.getElementById('lpass').value,er=document.getElementById('lerr');
    const s=slugPseudo(p);if(s.length<3)return er.textContent='Le pseudo doit contenir au moins 3 lettres ou chiffres.';if(pw.length<6)return er.textContent='Le mot de passe doit faire au moins 6 caractères.';
    if(loginMode==='up'&&pw!==document.getElementById('lpass2').value)return er.textContent='Les deux mots de passe ne correspondent pas.';
    er.textContent='Connexion…';try{localStorage.setItem('orion-pseudo',p.trim())}catch(x){}
    const r=loginMode==='up'?await sb.auth.signUp({email:pseudoMail(p),password:pw}):await sb.auth.signInWithPassword({email:pseudoMail(p),password:pw});
    if(r.error)return er.textContent=authMsg(r.error);
    if(loginMode==='up'&&!r.data.session)er.textContent=authMsg({message:'email not confirmed'})})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='lmode'){loginMode=b.dataset.m;showLogin()}
  if(b.dataset.act==='logout'){sb&&sb.auth.signOut().then(()=>location.reload())}});

// ---------- démarrage ----------
let started=false;
function boot(){
  if(!sbInit()){S.nodb=true;render();return}
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user;
    if(!u){if(window.__upd)return;if(started&&ev==='SIGNED_OUT')location.reload();else if(!started)showLogin();return}
    if(started)return;ME=u.id;try{const ps=localStorage.getItem('orion-pseudo');if(ps)S.pseudo=ps}catch(e){}if(!S.pseudo)S.pseudo=(u.email||'').split('@')[0];setTimeout(startGame,0)})}
function startGame(){if(started)return;started=true;db=DBA;main.innerHTML='<div class="join"><div class="hero">Couronne <span>d\'Orion</span></div><p class="lead">Connexion à la galaxie…</p></div>';
  const seen={p:0,pl:0,f:0,r:0};const ready=k=>{if(!seen[k]){seen[k]=1;S.ready++}render()};
  const fail=e=>{console.error(e);if(e&&e.code==='invalid_argument'){S.nodb=true;S.nodbMsg='Accès refusé par la base de données. Vérifie que le script SQL a bien été exécuté dans Supabase.';render()}};
  db.collection('planets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='planet'&&x.pid)o[x.pid]=x}S.planets=o;ready('p')},fail);
  db.collection('players').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='player')o[x.uid]=x}S.players=o;ready('pl')},fail);
  db.collection('fleets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='fleet')o[x.fid]=x}S.fleets=o;ready('f')},fail);
  db.collection('chat').onSnapshot(s=>{S.chat=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.kind==='chat'&&m.text).sort((a,b)=>a.at-b.at).slice(-120);chatUpdate()},()=>{});
  db.collection('events').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='event')o[x.id]=x}S.events=o;if(S.ready>=3)render()},fail);
  db.collection('reports').where('to','array-contains',ME).orderBy('at','desc').limit(60).onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.kind==='report');reportSounds();if(S.ready>=3)render()},fail);
  setInterval(tick,1000);
  if(notifOk()&&pushOn())setTimeout(()=>pushSubscribe(true),4000);
}
boot();
// ---------- mises à jour : chaque nouvelle version déconnecte les joueurs et recharge l'appli ----------
const APP_VERSION='178';
async function checkUpdate(){if(window.__upd)return;let v;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;v=String((await r.json()).v)}catch(e){return}
  if(!v||v===APP_VERSION)return;let k={};try{k=JSON.parse(localStorage.getItem('orion-upd')||'{}')}catch(e){}
  if(k.v===v&&Date.now()-k.at<90000)return; // la page vient d'être rechargée : on laisse le temps au serveur de servir la nouvelle version
  window.__upd=true;document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#05081acc;color:#fff;font:600 17px system-ui;text-align:center;padding:20px">Nouvelle version du jeu<br><span style="font-weight:400;font-size:14px;opacity:.8">Chargement en cours…</span></div>');
  const T=(pr,ms=2500)=>Promise.race([Promise.resolve(pr).catch(()=>{}),sleep(ms)]); // aucune étape ne doit bloquer
  setTimeout(()=>location.reload(),8000);
  try{localStorage.setItem('orion-upd',JSON.stringify({v,at:Date.now()}))}catch(e){}
  // la session reste ouverte : on vide seulement le cache et on recharge
  try{await T(caches.keys().then(ks=>Promise.all(ks.map(x=>caches.delete(x)))))}catch(e){}
  try{await T(navigator.serviceWorker.getRegistration().then(rg=>rg&&rg.update()))}catch(e){}
  location.href=location.pathname+'?v='+v}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
