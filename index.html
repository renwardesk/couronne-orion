<style>

.top .wrap{padding-block:10px;display:grid;gap:8px}

.tab .ti{display:block;width:19px;height:19px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}.tab[aria-current="true"] .ti{opacity:1;filter:drop-shadow(0 0 4px color-mix(in srgb,currentColor 55%,transparent))}

function runQ(list,t,add){const keep=[];for(const it of list||[]){if(t>it.start){const done=Math.min(it.n,Math.floor((t-it.start)/(it.per*1000)));if(done>0){add(it.t,done);it.n-=done;it.start+=done*it.per*1000}}if(it.n>0)keep.push(it)}return keep}
function settle(p,t){const q=clone(p);if(!q.owner)return q;
  for(const k in(isBody(q.pid)?BUILD_OUT:BUILD))if(q.lv[k]==null)q.lv[k]=0;
  q.ships=Object.assign(zeroShips(),q.ships||{});q.mods=q.mods||{};
  {const bq=[...(q.build?[q.build]:[]),...(q.bq||[])];q.build=null;while(bq.length&&bq[0].until<=t){const it=bq.shift();accrue(q,it.until);q.lv[it.k]=(q.lv[it.k]||0)+1}q.bq=bq}
  accrue(q,t);
  q.shipQ=runQ(q.shipQ,t,(k,n)=>{q.ships[k]=(q.ships[k]||0)+n});
  q.armQ=runQ(q.armQ,t,(k,n)=>{q.mods[k]=(q.mods[k]||0)+n});
  return q}

const outpostDoc=(pid,owner)=>({kind:'planet',pid,owner,outpost:true,capital:false,res:{m:0,c:0,f:0},at:Date.now(),lv:{drill:1,dock:0,def:0},build:null,ships:zeroShips(),shipQ:[]});

function techOf(pl){if(NOTECH)return{};const t={...(pl&&pl.tech||{})};const r=pl&&pl.research;if(r&&r.until<=Date.now())t[r.k]=(t[r.k]||0)+1;return t}
function loadoutOf(pl){const lo={};if(NOTECH){for(const k in SLOTS)lo[k]=Array(SLOTS[k]).fill(null);return lo}for(const k in SLOTS){const a=(pl&&pl.loadout&&pl.loadout[k])||[];lo[k]=Array.from({length:SLOTS[k]},(_,i)=>a[i]||null)}return lo}
function modsOf(uid){const pl=uid&&S.players[uid],tech=techOf(pl),lo=loadoutOf(pl),out={};
  for(const k of[...SK,'turret','flag']){const m={att:1,hp:1,vs:{},red:0};for(const w of lo[k]||[]){if(!w||!WEAP[w])continue;const e=1+.2*(Math.max(1,tech[w]||1)-1),W=WEAP[w];if(W.att)m.att+=W.att*e;if(W.hp)m.hp+=W.hp*e;if(W.red)m.red=Math.min(.6,1-(1-m.red)*(1-W.red*e));if(W.vs)for(const t in W.vs)m.vs[t]=(m.vs[t]||0)+W.vs[t]*e}out[k]=m}return out}

const resCost=(w,L)=>{const x=1.7**L,c=WEAP[w].rc,r=WEAP[w].rr,o={m:Math.round(c.m*x),c:Math.round(c.c*x),f:Math.round(c.f*x)},rr={};for(const k in r)rr[k]=Math.round(r[k]*1.5**L);return[o,rr]};

// ---------- combat (contre-unités et armes) ----------
function battle(a0,d0,ma,md,RN,KD){const cl=s=>{const o={};for(const k in s)if(s[k]>0)o[k]=s[k];return o};const a=cl(a0),d=cl(d0),ia=clone(a),id=clone(d);ma=ma||modsOf(null);md=md||modsOf(null);let rounds=0;
  const kills=(atk,mA,def,mD)=>{const out={},acc={},H=k=>UNIT[k].hp*mD[k].hp,shield=Object.keys(def).some(v=>v!=='colony'&&def[v]>0),tg=u=>def[u]>0&&(u!=='colony'||!shield);let hp=0;for(const k in def)if(tg(k))hp+=def[k]*H(k);if(hp<=0)return out;
    for(const t in atk){const dmg=atk[t]*UNIT[t].att*mA[t].att*(KD||1);if(!dmg)continue;for(const u in def){if(!tg(u))continue;const mult=((CTR[t]&&CTR[t][u])||1)*(1+(mA[t].vs[u]||0))*(1-mD[u].red);acc[u]=(acc[u]||0)+dmg*(def[u]*H(u)/hp)*mult/H(u)}}
    for(const u in acc){let n=Math.floor(acc[u]);if(Math.random()<acc[u]-n)n++;out[u]=Math.min(def[u],n)}return out};
  const snaps=[];for(let r=0;r<(RN||8);r++){if(isEmpty(a)||isEmpty(d))break;rounds++;const ka=kills(d,md,a,ma),kd=kills(a,ma,d,md);for(const k in ka)a[k]-=ka[k];for(const k in kd)d[k]-=kd[k];snaps.push({a:{...a},d:{...d}})}
  return{a,d,ia,id,rounds,snaps}}
const plur=(n,w)=>n>1?w.split(' ').map((x,i)=>i?x:(x.endsWith('au')?x+'x':x+'s')).join(' '):w;
const unitLine=s=>{const parts=Object.keys(s||{}).filter(k=>s[k]>0).map(k=>`${s[k]} ${plur(s[k],UNIT[k].n.toLowerCase())}`);return parts.length?parts.join(', '):'aucune unité'};
const lossLine=(i,f)=>{const parts=Object.keys(i).filter(k=>i[k]-(f[k]||0)>0).map(k=>`${i[k]-(f[k]||0)} ${plur(i[k]-(f[k]||0),UNIT[k].n.toLowerCase())}`);return parts.length?parts.join(', '):'aucune'};
// estimation des chances de victoire : on rejoue le combat plusieurs fois et on lisse le résultat
function winChance(att,def,ma,md){const A={},D={};for(const k in att||{})if(att[k]>0)A[k]=att[k];for(const k in def||{})if(def[k]>0)D[k]=def[k];if(isEmpty(A))return 0;if(isEmpty(D))return 100;
  const N=40,wa=worth(A),wd=worth(D);let w=0,sc=0;for(let i=0;i<N;i++){const B=battle(A,D,ma,md,8);if(isEmpty(B.d)&&!isEmpty(B.a))w++;sc+=worth(B.a)/wa-worth(B.d)/wd}
  const emp=w/N,sig=1/(1+Math.exp(-3*sc/N));return Math.max(1,Math.min(99,Math.round(100*(.2*emp+.8*sig))))}

async function salvageArrival(f,fref,meta,tn){let got=null;const s=SYSTEMS[meta.sys];
  await locked('events/salv-'+meta.sys,async(ev,eref)=>{const nw=Date.now(),fr=Math.min(1,(nw-(ev&&ev.at||0))/(6*HR)),k=GALS[s.gal].rich*(1+s.gate*.4);if(fr<.05)return;
    const capT=cargoCap(f.ships),pool={m:5000*k*fr,c:3800*k*fr,f:1800*k*fr},ratio=Math.min(1,capT/(pool.m+pool.c+pool.f)),r=rng(hash(f.fid+'salv')),avail=WK.filter(w=>WEAP[w].tier<=1+Math.floor(s.gate/2)),mods={};

    got={res:{m:Math.floor(pool.m*ratio),c:Math.floor(pool.c*ratio),f:Math.floor(pool.f*ratio)},rare:{ir:Math.round(30*k*fr),xe:Math.round(20*k*fr),am:Math.round(8*k*fr)},mods};await eref.set({kind:'event',id:'salv-'+meta.sys,at:nw})});

// Léviathans des Écumeurs : énormes vaisseaux-mères stationnés dans le vide, entre deux systèmes voisins. Plus forts qu'une horde.
(function registerLeviathans(){const lv=a=>GALS[a.gal].rich*(1+(500-Math.min(a.rad,500))/400);
  for(let g=0;g<GALS.length;g++){const L=SYS_BY_GAL[g].filter(s=>!s.deep),seen=new Set(),placed=[],cand=[],maxR=Math.max(...L.map(s=>s.rad));

const AMB_INT=20*60e3,AMB_INT_FOG=10*60e3;
async function holdAt(f,fref,ships,cargo,extra={}){if(isEmpty(ships)){await fref.delete();if(f.cmd)await killCmd(f.owner,f.cmd);return}
  if(f.cmd&&(f.ships||{}).flag&&!(ships||{}).flag){await killCmd(f.owner,f.cmd);f={...f,cmd:null}}
  await fref.set({...f,...extra,ships,cargo,phase:'hold',holdAt:f.arrive,lastAmb:f.arrive,amb:0,home:f.home||f.from,group:null})}
function sysPacksAlive(si){const s=SYSTEMS[si];if(!s)return[];return[s.lair,...(s.packs||[])].filter(pid=>{const st=raidState(pid);return!st.done&&!st.absent&&worth(st.garrison)>0})}

  await locked('events/'+pid,async(ev,eref)=>{const t=Date.now(),gar=raidGarrison(pid,ev&&ev.done?null:ev,t),party=scaleShips(gar,.5),rest={};for(const k in gar)rest[k]=(gar[k]||0)-(party[k]||0);CMDCTX.vs='raid';B=battle(party,f.ships,raidMods(pid),forceMods(f.owner,f.cmd));CMDCTX.vs=null;
    const left={};for(const k in gar)left[k]=(rest[k]||0)+(B.a[k]||0);const e2={...(ev||{}),kind:'event',id:pid,remaining:left,at:t};if(R.lair){const L=lairInfoAt(SYSTEMS[si],t);if(L)e2.founded=L.founded}if(isEmpty(left)){e2.done=true;e2.doneAt=t}await eref.set(e2)});
  const surv=zeroShips();addShips(surv,B.d);const dead=isEmpty(surv),tn=plName(f.to);

  if(dead){await fref.delete();if(f.cmd)await killCmd(f.owner,f.cmd)}else await fref.set({...f,ships:surv,lastAmb:Date.now(),amb:n});
  await report({to:[f.owner],tone:dead?'loss':'win',loser:dead?f.owner:null,title:dead?`Flotte anéantie dans une embuscade près de ${tn}`:`Embuscade des Écumeurs près de ${tn}`,
    lines:[`Une escouade de la ${PLANETS[pid].name} attaque ta flotte en position.`,`Écumeurs : ${unitLine(B.ia)} — pertes : ${lossLine(B.ia,B.a)}.`,`Ta flotte : ${unitLine(B.id)} — pertes : ${lossLine(B.id,B.d)}.`,dead?'La cargaison est perdue.':'Plus ta flotte reste dans une zone infestée, plus le risque grandit.'],
    battle:{ia:B.id,id:B.ia,rounds:B.snaps.map(x=>({a:x.d,d:x.a})),att:[{uid:f.owner,ships:B.id,ck:(cmdById(f.owner,f.cmd)||{}).key||null}],def:'raid',pid:f.to}})}
async function fleetHome(fid){await act(async()=>{await locked('fleets/'+fid,async(f,ref)=>{if(!f||f.owner!==ME||(f.phase!=='hold'&&f.phase!=='wait'))throw err('Cette flotte n’est plus en position.');

const SPEC={att:{n:'Assaut',d:v=>`+${v} % attaque de toute la flotte`},hp:{n:'Blindage',d:v=>`+${v} % PV de toute la flotte`},

const CMDDB=[

  ['c13','Vigie Sélia','c','spd'],['c14','Sergente Aéla','c','att'],['c15','Mécano Joss','c','hp'],['c16','Navigatrice Ysa','c','amb'],
  ['r1','Capitaine Cassian','r','att'],['r2','Capitaine Ysolde','r','cruiser'],['r3','Corsaire Morvan','r','pirates'],['r4','Major Sylas','r','hp'],['r5','Chef d’escadre Vega','r','fighter'],['r6','Commodore Hale','r','battleship'],
  ['r7','Pisteuse Kael','r','spd'],['r8','Veilleur Ombral','r','amb'],['r9','Professeur Iriel','r','xp'],['r10','Capitaine Draven','r','att'],['r11','Corsaire Lyse','r','pirates'],['r12','Major Tessia','r','hp'],
  ['e1','Amirale Séraphine Vaux','e','att'],['e2','Le Spectre de Carina','e','spd'],['e3','Grand Veneur Thorne','e','pirates'],['e4','Bastion Aldric','e','hp'],['e5','Marteau d’Hélios','e','battleship'],['e6','Ombre de Vela','e','amb'],
  ['e7','Lame de Rigel','e','fighter'],['e8','Stratège Olric','e','cruiser'],
  ['l1','L’Héritière de la Couronne','l','att'],['l2','Kaelor Brise-Étoiles','l','battleship'],['l3','La Voix du Néant','l','pirates'],['l4','Orion l’Ancien','l','hp']];
const CMDK=Object.fromEntries(CMDDB.map(([k,n,r,sp])=>[k,{k,n,r,sp}]));
const CMD_LMAX=10;

// insignes : butin des repaires, Armadas, hordes, sentinelles et gardiens ; servent à entraîner les commandants
const insDrop=R=>!R?0:R.boss||(R.mid&&!R.esc)?3:(R.lair||R.guard||!R.local)?2:R.tier>=1?1:(Math.random()<.35?1:0);

function forceMods(owner,cmd){const m=modsOf(owner),c=cmdById(owner,cmd);if(!c)return m;const L=cmdLvl(c.xp),i=cmdInfo(c),v=cmdSpecVal(c)/100,o={};
  const FM={c:1,r:1.3,e:1.7,l:2.2}[i.r]||1;for(const k in m){let a=m[k].att*(1+.02*L),h=m[k].hp*(1+.015*L);if(k==='flag'){a*=FM;h*=FM}if(i.sp==='att')a*=1+v;if(i.sp==='hp')h*=1+v;if(i.sp===k)a*=1+2*v;if(i.sp==='pirates'&&CMDCTX.vs==='raid')a*=1+2*v;o[k]={...m[k],att:a,hp:h}}return o}

function rollRar(p,r){let x=r,acc=0;for(const k of['c','r','e','l']){acc+=p[k]||0;if(x<acc)return k}return'c'}
async function openChest(t){await act(async()=>{const C=CHEST[t];if(!C)return;const pl=S.players[ME];if(t==='st'?pl.starter:!(chestsOf(ME)[t]>0))throw err('Tu n’as pas ce coffre.');

      pay(p.res,WEAP[w].mc,n);p.armQ=p.armQ||[];const last=p.armQ[p.armQ.length-1];p.armQ.push({t:w,n,per:modTime(w,p.lv.arsenal),start:last?Math.max(now,last.start+last.n*last.per*1000):now});await ref.set(p)});
    payR(d.rare,WEAP[w].mr,n)});sfx.build();toast(`${n} module${n>1?'s':''} « ${WEAP[w].n} » en production.`)})}
async function mount(cls,slot,w){await act(async()=>{const pid=S.sel;await withPlayer(ME,async d=>{
    if(w){const need=MOUNT[cls];await locked('planets/'+pid,async(pd,ref)=>{if(!pd||pd.owner!==ME)throw err('Planète perdue.');const p=settle(pd,Date.now());if((p.mods[w]||0)<need)throw err(`Il faut ${need} modules « ${WEAP[w].n} » sur cette planète.`);p.mods[w]-=need;await ref.set(p)})}
    const lo=loadoutOf(d);lo[cls][slot]=w||null;d.loadout=lo});if(w){sfx.build();toast(`${WEAP[w].n} monté sur ${SHIPS[cls].n}.`)}else toast('Emplacement libéré.')})}
async function savePaint(part,c){await act(async()=>{await withPlayer(ME,d=>{d.paint={...(d.paint||{}),[part]:c}})})}
async function recall(fid){await act(async()=>{await locked('fleets/'+fid,async(f,ref)=>{const now=Date.now();if(!f||f.owner!==ME||f.phase!=='out'||f.arrive<=now)throw err('Cette flotte ne peut plus être rappelée.');
  const el=now-f.depart;await ref.set({...f,phase:'back',recalled:true,group:null,arrive:now,back:now+el})});toast(`Flotte rappelée : retour à ${clock(Date.now()+(Date.now()-(S.fleets[fid]||{depart:Date.now()}).depart))}.`)})}
async function launch(){const M=S.modal;if(M.fleet)return launchHeld(M);fixMis(M);const ships={};for(const k of SK)if(M.ships[k]>0)ships[k]=M.ships[k];
  await act(async()=>{if(galOf(M.to)>unlockedOf(ME))throw err('Galaxie verrouillée : vaincs d’abord le gardien du trou noir qui y mène.');if(isEmpty(ships))throw err('Choisis au moins un vaisseau.');if(M.mission==='colonize'&&!(ships.colony>0))throw err('Un vaisseau colon est nécessaire.');
    if(M.mission==='spy'&&(!(ships.probe>0)||count(ships)!==ships.probe))throw err('Une mission d’espionnage n’emporte que des sondes.');
    if(M.mission==='reinforce'&&!activeBattle(M.to)&&!(S.planets[M.to]&&S.planets[M.to].owner&&S.planets[M.to].owner!==ME))throw err('Le renfort se fait vers la planète d’un autre joueur.');if(M.mission==='intercept'){const c=S.fleets[M.intercept];if(!c||c.phase!=='out')throw err('Cette cible est déjà arrivée.');if(c.owner===ME)throw err('Tu ne peux pas intercepter ta propre flotte.');if(c.mission!=='attack'&&Date.now()+etaOf(M.from,M.to,ships)*1000>c.arrive-5000)throw err('Trop lent : ta flotte arriverait après le convoi.')}if(M.cmd&&cmdBusy(ME,M.cmd))throw err('Ce commandant est déjà en mission.');
    const IPc=M.mission==='intercept'&&S.fleets[M.intercept]&&S.fleets[M.intercept].mission==='attack'?S.fleets[M.intercept]:null,IP=IPc?interceptPlan(M.from,IPc,ships,cmdSpeed(ME,M.cmd)):null;if(IPc&&!IP)throw err('Trop lent : ta flotte ne peut pas rattraper cette attaque avant son arrivée.');
    if(M.mission==='transfer'&&S.planets[M.to]){const tv=view(M.to),u=bayUse(tv,ME),c=bayCap(tv),need=placesOf(ships);if(u+need>c)throw err(`Hangars de destination pleins : ${u}/${c} places, il en faut ${need}.`)}
    const fuel=fuelOf(M.from,M.to,ships),eta=Math.round(etaOf(M.from,M.to,ships)/cmdSpeed(ME,M.cmd)),body=isBody(M.from);const LJ=M.join?S.fleets[M.join]:null;if(M.join&&(!LJ||LJ.phase!=='out'||LJ.arrive<Date.now()+eta*1000))throw err('Trop tard pour rejoindre cette attaque.');
    await locked('planets/'+M.from,async(d,ref)=>{if(!d||d.owner!==ME)throw err('Point de départ perdu.');const p=settle(d,Date.now());
      if(body&&p.lv.dock<1)throw err('Construis une base de flotte sur cet avant-poste pour lancer des missions.');
      for(const k in ships)if((p.ships[k]||0)<ships[k])throw err('Vaisseaux insuffisants sur place.');
      if(body){const cap=capitalOf(ME);await locked('planets/'+cap.pid,async(cd,cref)=>{const q=settle(cd,Date.now());if(q.res.f<fuel)throw err('Hélium-3 insuffisant dans ta capitale.');q.res.f-=fuel;await cref.set(q)})}
      else{if(p.res.f<fuel)throw err('Hélium-3 insuffisant.');p.res.f-=fuel}
      for(const k in ships)p.ships[k]-=ships[k];await ref.set(p)});
    const id=newId(),now=Date.now();
    await db.doc('fleets/'+id).set({kind:'fleet',fid:id,owner:ME,from:M.from,to:M.to,mission:M.mission,ships,cargo:{m:0,c:0,f:0},depart:now,arrive:IP?IP.t:LJ?LJ.arrive:now+eta*1000,phase:'out',...(IP?{meet:IP.p}:{}),...(LJ?{group:LJ.fid}:{}),...(M.cmd?{cmd:M.cmd,ships:{...ships,flag:1}}:{}),...(M.intercept?{target:M.intercept}:{})});
    S.modal=null;renderModal();sfx.launch();toast(IP?`Interception lancée : rencontre à ${clock(IP.t)}.`:`Flotte lancée. Arrivée à ${clock(LJ?LJ.arrive:now+eta*1000)}.`)})}
async function join(){const name=(document.getElementById('pseudo').value||'').trim().slice(0,18);if(name.length<2)return toast('Choisis un nom d’au moins 2 caractères.','bad');
  if(S.joinColor&&takenColors().has(S.joinColor.toLowerCase()))return toast('Cette couleur est déjà prise par un autre empire.','bad');
  const color=(S.joinColor||freeColor()).toLowerCase();
  const used=new Set(Object.keys(S.planets));const ownedSys=new Set(Object.values(S.planets).filter(p=>p.owner).map(p=>PLANETS[p.pid].sys));
  const free=p=>!p.body&&!p.raid&&!used.has(p.pid)&&!ownedSys.has(p.sys)&&(lairInfoAt(SYSTEMS[p.sys])||{}).pid!==p.pid;
  // on démarre près du premier empire fondé (l'hôte), dans un système voisin libre
  const anchor=Object.values(S.players).sort((a,b)=>(a.joined||0)-(b.joined||0)).map(p=>capitalOf(p.uid)).find(Boolean);let c=[];
  if(anchor){const A=SYSTEMS[PLANETS[anchor.pid].sys];c=Object.values(PLANETS).filter(p=>free(p)&&SYSTEMS[p.sys].gal===A.gal).map(p=>({p,d:Math.hypot(SYSTEMS[p.sys].x-A.x,SYSTEMS[p.sys].y-A.y,SYSTEMS[p.sys].z-A.z)})).filter(x=>x.d>=30).sort((a,b)=>a.d-b.d);const near=[...new Set(c.map(x=>x.p.sys))].slice(0,4);c=c.filter(x=>near.includes(x.p.sys)).map(x=>x.p)}
  if(!c.length)c=Object.values(PLANETS).filter(p=>free(p)&&SYSTEMS[p.sys].rad>250&&SYSTEMS[p.sys].gal===0);if(!c.length)c=Object.values(PLANETS).filter(p=>!p.body&&!p.raid&&!used.has(p.pid));
  c.sort(()=>Math.random()-.5);
  // un double appui ne doit pas fonder deux capitales
  if(S.joining)return;if(Object.values(S.planets).some(p=>p.owner===ME&&p.capital))return toast('Tu as déjà une capitale.','bad');S.joining=true;
  try{await act(async()=>{// la couleur est réservée d’abord : deux nouveaux joueurs ne peuvent pas prendre la même au même moment
    await locked('colors/'+color.slice(1),async(d,ref)=>{if(d&&d.uid&&d.uid!==ME)throw err('Cette couleur vient d’être prise par un autre empire. Choisis-en une autre.');if(takenColors().has(color))throw err('Cette couleur est déjà prise par un autre empire.');await ref.set({kind:'color',uid:ME,at:Date.now()})});
    for(const cand of c.slice(0,6)){let ok=false;await locked('planets/'+cand.pid,async(d,ref)=>{if(d&&d.owner)return;await ref.set(homePlanet(cand.pid,ME));ok=true});
    if(ok){await db.doc('players/'+ME).set({kind:'player',uid:ME,name,color,joined:Date.now(),rare:{ir:40,xe:10,am:0},rareAt:Date.now(),tech:{},loadout:{},paint:{}});S.sel=cand.pid;S.tab='planet';sfx.win();toast(`Bienvenue, ${name}. Ta capitale est ${cand.name}.`);return}}
    throw err('Aucune planète libre trouvée.')})}finally{S.joining=false}}

const busy=new Set();
const NEWS_MAX=80;
async function addNews(r){const types=[].concat(r.news||[]);if(!types.length)return;const uids=[...new Set((r.newsBy||r.to||[]).filter(u=>S.players[u]))];
  for(const type of types){const id='nw-'+newId();try{await db.doc('events/'+id).set({kind:'event',id,news:true,type,at:Date.now(),title:r.title,uids,pid:r.pid||(r.battle&&r.battle.pid)||null,tone:r.tone||'info'})}catch(e){}}
  try{const old=Object.values(S.events).filter(e=>e.news).sort((a,b)=>b.at-a.at).slice(NEWS_MAX);for(const e of old)await db.doc('events/'+e.id).delete()}catch(e){}}
async function report(r){{const{news,newsBy,...rest}=r;if(news)addNews(r).catch(()=>{});r=rest}try{await db.collection('reports').doc(newId()).set({kind:'report',at:Date.now(),...r})}catch(e){}}
const allPlayers=()=>Object.keys(S.players);
async function goBack(f,fref,ships,cargo,extra={}){if(isEmpty(ships)){await fref.delete();if(f.cmd)await killCmd(f.owner,f.cmd);return}
  if(f.cmd&&(f.ships||{}).flag&&!(ships||{}).flag){await killCmd(f.owner,f.cmd);f={...f,cmd:null}}
  if(f.home&&f.home!==f.from){const eta=etaOf(f.to,f.home,ships);await fref.set({...f,...extra,ships,cargo,from:f.home,phase:'back',depart:f.arrive-eta*1000,back:f.arrive+eta*1000});return}
  await fref.set({...f,...extra,ships,cargo,phase:'back',back:f.arrive+(f.arrive-f.depart)})}

const plName=pid=>(PLANETS[pid]&&PLANETS[pid].name)||'Cible disparue';
async function gatherJoiners(f){const out=[];for(const j of Object.values(S.fleets)){if(j.group!==f.fid||j.phase!=='out'||j.fid===f.fid)continue;
  try{await locked('fleets/'+j.fid,async(jd,jref)=>{if(jd&&jd.phase==='out'&&jd.group===f.fid&&jd.to===f.to)out.push({f:jd,ref:jref})})}catch(e){}}return out}
function avgMods(list){const acc={};for(const x of list){const m=forceMods(x.owner,x.cmd||(x.f&&x.f.cmd)),sh=x.ships||{};
  for(const k in m){const w=(sh[k]||0)*(VALUE[k]||1)||1e-6,a=acc[k]=acc[k]||{att:0,hp:0,vs:{},red:0,W:0};a.W+=w;a.att+=m[k].att*w;a.hp+=m[k].hp*w;a.red+=m[k].red*w;for(const t in m[k].vs)a.vs[t]=(a.vs[t]||0)+m[k].vs[t]*w}}
  for(const k in acc){const a=acc[k],W=a.W||1;a.att/=W;a.hp/=W;a.red/=W;for(const t in a.vs)a.vs[t]/=W;delete a.W}return acc}
function groupFight(forces,def,md){const tot={};for(const x of forces)for(const k in x.ships)if(x.ships[k]>0)tot[k]=(tot[k]||0)+x.ships[k];
  const B=battle(tot,def,avgMods(forces),md),surv=forces.map(()=>zeroShips());
  for(const k in tot){const before=tot[k],after=B.a[k]||0;let rem=after;const sh=forces.map((x,i)=>({i,n:x.ships[k]||0}));
    sh.forEach(s=>{const v=Math.floor(after*s.n/before);surv[s.i][k]=v;rem-=v});sh.sort((a,b)=>b.n-a.n);for(let q=0;rem>0&&q<sh.length*2;q++){const s=sh[q%sh.length];if(surv[s.i][k]<s.n){surv[s.i][k]++;rem--}}}
  return{B,surv}}
// répartit un butin disponible selon la soute des survivants
function splitLoot(avail,surv){const caps=surv.map(s=>cargoCap(s)),C=caps.reduce((a,b)=>a+b,0),tot=avail.m+avail.c+avail.f;if(!C||!tot)return surv.map(()=>({m:0,c:0,f:0}));
  const take=Math.min(1,C/tot);return caps.map(c=>({m:Math.floor(avail.m*take*c/C),c:Math.floor(avail.c*take*c/C),f:Math.floor(avail.f*take*c/C)}))}
const sumLoot=a=>a.reduce((t,x)=>({m:t.m+x.m,c:t.c+x.c,f:t.f+x.f}),{m:0,c:0,f:0});
const treasureOf=units=>{const w=worth(units);return{m:Math.round(w*55),c:Math.round(w*40),f:Math.round(w*20)}};
const lootTxt=l=>`${fmt(l.m)} métal, ${fmt(l.c)} cristal, ${fmt(l.f)} hélium-3`;
const cultureRate=uid=>0; // la culture ne se gagne qu'au combat (1 point de combat = 1 culture)
// 1 planète au départ, la 2e presque tout de suite, puis de plus en plus de culture
// emplacements de planètes : 2 au départ, chaque palier suivant se débloque en dépensant de la culture
const slotsOf=uid=>Math.min(MAXP,((S.players[uid]||{}).slots)||2);
const slotCost=n=>Math.round(300*Math.pow(Math.max(1,n-1),1.6)); // passer de n à n+1 emplacements
const cultureCost=uid=>slotCost(slotsOf(uid));
async function unlockSlot(){await act(async()=>{await withPlayer(ME,d=>{const n=Math.min(MAXP,d.slots||2);if(n>=MAXP)throw err('Tu as déjà débloqué le maximum de planètes.');const c=slotCost(n),cu=d.culture??50;
  if(cu<c)throw err(`Il faut ${fmt(c)} points de combat (tu en as ${fmt(cu)}). Gagne-en en combattant.`);d.culture=cu-c;d.slots=n+1});sfx.win();toast(`Nouvel emplacement débloqué : tu peux avoir ${slotsOf(ME)} planètes.`)})}
async function payCulture(uid){return planetsOf(uid)<slotsOf(uid)}
async function award(list){const by={};for(const{uid,v,frag,cmd}of list){if(!uid||!S.players[uid])continue;const b=by[uid]=by[uid]||{v:0,frag:0,cx:{}};b.v+=v||0;b.frag+=frag||0;if(cmd)b.cx[cmd]=(b.cx[cmd]||0)+(v||0)*cmdXpMul(uid,cmd)}
  for(const[uid,b]of Object.entries(by)){const v=Math.round(b.v);if(v<=0&&!b.frag)continue;try{await withPlayer(uid,d=>{d.cp=(d.cp||0)+v;d.culture+=v;if(b.frag)d.frag=(d.frag||0)+b.frag;for(const id in b.cx){const c=(d.cmds||[]).find(x=>x.id===id);if(c)c.xp=(c.xp||0)+Math.round(b.cx[id])}})}catch(e){}}}
// part de chaque attaquant (selon la valeur engagée)
const shares=forces=>{const ws=forces.map(x=>worth(x.ships)),W=ws.reduce((a,b)=>a+b,0)||1;return ws.map(w=>w/W)};

async function arrival(f,fref){const reps=[];const meta=PLANETS[f.to];if(!meta){await goBack(f,fref,f.ships,f.cargo);return}
  const tn=meta.name,body=isBody(f.to);
  if(PLANETS[f.from]&&galOf(f.from)!==galOf(f.to)&&!f.beltDone){const lost={};for(const k of['fighter','probe']){const n=Math.floor((f.ships[k]||0)*.05);if(n>0){lost[k]=n;f.ships={...f.ships,[k]:f.ships[k]-n}}}f.beltDone=true;if(count(lost))await report({to:[f.owner],tone:'info',title:'Traversée des ceintures d’astéroïdes',lines:[`Entre les galaxies, ta flotte a perdu ${unitLine(lost)} dans les champs d’astéroïdes.`]})}
  await exploreMark([f.owner,...Object.values(S.fleets).filter(j=>j.group===f.fid).map(j=>j.owner)],meta.sys);
  // récolte de comète
  if(f.mission==='harvest'&&mcAt(f.to,f.arrive)&&!(cometAt(f.arrive)&&cometAt(f.arrive).pid===f.to)){await miniHarvest(f,fref,tn);return}
  if(f.mission==='harvest'){const cm=cometAt(f.arrive);let got=null;
    if(cm&&cm.pid===f.to)await locked('events/'+cm.id,async(ev,eref)=>{if(ev&&ev.claimedBy)return;const capT=cargoCap(f.ships),tot=COMET_BOUNTY.m+COMET_BOUNTY.c+COMET_BOUNTY.f,ratio=Math.min(1,capT/tot);got={m:Math.floor(COMET_BOUNTY.m*ratio),c:Math.floor(COMET_BOUNTY.c*ratio),f:Math.floor(COMET_BOUNTY.f*ratio)};await eref.set({kind:'event',id:cm.id,claimedBy:f.owner,at:Date.now()})});
    if(got){await holdAt(f,fref,f.ships,got,{rareCargo:COMET_RARE});reps.push({to:allPlayers(),tone:'info',title:`${pname(f.owner)} a récolté la comète de ${tn}`,lines:[`Cargaison : ${lootTxt(got)}, plus ${COMET_RARE.ir} iridium, ${COMET_RARE.xe} xénite et ${COMET_RARE.am} antimatière.`]})}
    else{await goBack(f,fref,f.ships,f.cargo);reps.push({to:[f.owner],tone:'info',title:`Comète déjà récoltée ou disparue`,lines:['La flotte rentre à vide.']})}
    for(const r of reps)await report(r);return}
  if(meta.type==='wreck'&&(f.mission==='salvage'||f.mission==='colonize')){const sen=(SYSTEMS[meta.sys].packs||[])[0];if(sen&&!raidState(sen).done){await holdAt(f,fref,f.ships,f.cargo);await report({to:[f.owner],tone:'info',title:`Les Sentinelles défendent ${tn}`,lines:['Anéantis d’abord les Sentinelles de l’épave (même endroit), puis reviens.']});return}}
  if(f.mission==='salvage'){await salvageArrival(f,fref,meta,tn);return}
  if(f.mission==='convoy'){await convoyArrival(f,fref);return}if(f.mission==='intercept'){await interceptArrival(f,fref);return}if(f.mission==='reinforce'){await reinforceArrival(f,fref);return}
  if(f.mission==='attack'){const nf=await interceptAttack(f,fref);if(!nf)return;f=nf}
  const joiners=f.mission==='attack'?await gatherJoiners(f):[];
  const forces=[{f,ref:fref,owner:f.owner,ships:f.ships},...joiners.map(j=>({f:j.f,ref:j.ref,owner:j.f.owner,ships:j.f.ships}))];
  const atkUids=[...new Set(forces.map(x=>x.owner))],grp=forces.length>1;
  const atkName=grp?`L’attaque groupée de ${atkUids.map(pname).join(', ')}`:pname(f.owner);
  const finish=async(surv,loots)=>{for(let i=0;i<forces.length;i++){if(isNpc(forces[i].owner)){await forces[i].ref.delete();continue}await holdAt(forces[i].f,forces[i].ref,surv[i],loots?loots[i]:{m:0,c:0,f:0})}};
  const rec=(B,def,extra={})=>({ia:B.ia,id:B.id,rounds:B.snaps,att:forces.map(x=>({uid:x.owner,ships:x.ships})),def,pid:f.to,...extra});
  const cmdLn=(won)=>{const L=forces.filter(x=>x.f&&x.f.cmd).map(x=>{const c=cmdById(x.owner,x.f.cmd);return c?`${cmdInfo(c).n} (${pname(x.owner)})`:null}).filter(Boolean);return L.length?[`🎖 ${L.length>1?'Commandants':'Commandant'} : ${L.join(', ')}${won?' — victorieux':''}.`]:[]};
  const fightLines=B=>[...cmdLn(isEmpty(B.d)&&!isEmpty(B.a)),`${grp?'Attaquants':'Attaquant'} : ${unitLine(B.ia)} — pertes : ${lossLine(B.ia,B.a)}.`,`Défense : ${unitLine(B.id)} — pertes : ${lossLine(B.id,B.d)}.`,...(isEmpty(B.a)?[]:[isEmpty(B.d)?'Les survivants restent en position : depuis l’onglet Flottes, rentre gratuitement ou lance une nouvelle mission.':'Ta flotte reste sur place : depuis l’onglet Flottes, « Nouvelle mission » sur la même cible pour relancer l’assaut aussitôt.'])];
  // la Ruche
  const hv=hiveAt(f.arrive);
  if(f.mission==='attack'&&hv&&hv.pid===f.to&&!(S.planets[f.to]&&S.planets[f.to].owner)){let G=null,done=null,val=0;
    await locked('events/'+hv.id,async(ev,eref)=>{ev=ev||{kind:'event',id:hv.id,remaining:HIVE0,contrib:{}};if(ev.done)return;
      G=groupFight(forces,ev.remaining,null);val=worth(ev.remaining)-worth(G.B.d);ev.remaining=G.B.d;const sh=shares(forces);ev.contrib={...ev.contrib};forces.forEach((x,i)=>{ev.contrib[x.owner]=(ev.contrib[x.owner]||0)+val*sh[i]});
      if(isEmpty(G.B.d)){ev.done=true;done=ev.contrib}await eref.set(ev)});
    if(!G){await finish(forces.map(x=>x.ships));reps.push({to:atkUids,tone:'info',title:'La Ruche a déjà été anéantie',lines:['Les flottes rentrent.']});for(const r of reps)await report(r);return}
    await finish(G.surv);const sh=shares(forces);await award(forces.map((x,i)=>({cmd:x.f&&x.f.cmd,uid:x.owner,v:val*sh[i]})));
    reps.push({to:atkUids,tone:'info',title:`Assaut contre la Ruche à ${tn}`,lines:[...fightLines(G.B),`Points de combat gagnés : ${Math.round(val)}.`],battle:rec(G.B,'hive')});

    if(MUS.step===0){const[root,notes]=P.chords[MUS.chord%P.chords.length];mPad(c,notes,t,P.len);mBass(c,root,t,P.len)}
    if(Math.random()<(MUS.tension?.22:.3)){const s=P.scale;mPluck(c,s[Math.floor(Math.random()*s.length)],t+(Math.random()<.3?.25:0),MUS.tension?.045:.038)}
    if(MUS.tension&&MUS.step%2===0)mKick(c,t,MUS.step%8===0?.32:.18);
    MUS.next+=.5;MUS.step++;if(MUS.step>=steps){MUS.step=0;MUS.chord++}}}
function ambient(on){const c=audio();if(!c)return;
  if(on&&!MUS.playing){musicSetup(c);MUS.playing=true;MUS.next=c.currentTime+.1;MUS.step=0;MUS.master.gain.cancelScheduledValues(c.currentTime);MUS.master.gain.setValueAtTime(MUS.master.gain.value,c.currentTime);MUS.master.gain.linearRampToValueAtTime(.9,c.currentTime+3);MUS.timer=setInterval(mSchedule,200);mSchedule();SFX.amb=true}
  else if(!on&&MUS.playing){MUS.playing=false;SFX.amb=null;clearInterval(MUS.timer);MUS.master.gain.cancelScheduledValues(c.currentTime);MUS.master.gain.setValueAtTime(MUS.master.gain.value,c.currentTime);MUS.master.gain.linearRampToValueAtTime(0,c.currentTime+1.2)}}

  let sub=await reg.pushManager.getSubscription();if(!sub){const r=await fetch(PUSH_FN()+'?key');const{pub}=await r.json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(pub)})}
  const{error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint,uid:ME,sub:sub.toJSON()});if(error)throw error;try{localStorage.setItem('orion-push-'+ME,'1')}catch(e){}return true}

const NZ=(()=>{const p=new Uint8Array(512),r=rng(7),a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)p[i]=a[i&255];
  const gr=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)};const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a);
  return(x,y,z)=>{const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z),X=fx&255,Y=fy&255,Z=fz&255;x-=fx;y-=fy;z-=fz;const u=fd(x),v=fd(y),w=fd(z);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lp(lp(lp(gr(p[AA],x,y,z),gr(p[BA],x-1,y,z),u),lp(gr(p[AB],x,y-1,z),gr(p[BB],x-1,y-1,z),u),v),lp(lp(gr(p[AA+1],x,y,z-1),gr(p[BA+1],x-1,y,z-1),u),lp(gr(p[AB+1],x,y-1,z-1),gr(p[BB+1],x-1,y-1,z-1),u),v),w)}})();

    for(const q of BT.plan||[])if(!q.done&&u>=q.at){q.done=true;btKill(q.x)}

      if(f.t>1.4){BT.g.remove(f.boom);BT.g.remove(f.pts);f.boom.material.dispose();f.pts.geometry.dispose();f.pts.material.dispose();return false}return true}return false});

// ---------- couche Supabase (même interface que la base d'origine) ----------
// Une seule table « docs » : path (clé), col (collection), data (jsonb), lease_holder / lease_exp (verrous courts).
let sb=null;
function sbInit(){const c=window.SUPABASE_CONFIG;if(!window.supabase||!c||!c.url||!c.key)return false;
  try{sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true}catch(e){console.error(e);return false}}
const pcolOf=path=>path.split('/').slice(0,-1).join('/');
const dsnap=(path,row)=>({id:path.split('/').pop(),exists:!!(row&&row.data),data:()=>row&&row.data?row.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}});
const sbErr=e=>{if(!e)return;const x=new Error(e.message||'Erreur base de données');x.code=(e.code==='42501'||/row-level security|permission/i.test(e.message||''))?'invalid_argument':'unavailable';throw x};
// diffusion temps réel : un seul canal pour toute la table, réparti par collection
const RT={listeners:new Map(),ch:null};
function rtStart(){if(RT.ch)return;RT.ch=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const path=(p.new&&p.new.path)||(p.old&&p.old.path);if(!path)return;const col=pcolOf(path);const ls=RT.listeners.get(col);if(!ls)return;
    for(const l of ls)l.apply(p.eventType==='DELETE'?{path,row:null}:{path,row:p.new})}).subscribe(st=>{if(st==='SUBSCRIBED')for(const ls of RT.listeners.values())for(const l of ls)l.resync()})}

  async get(){const{data,error}=await sb.from('docs').select('path,data').eq('path',path).maybeSingle();sbErr(error);return dsnap(path,data)},
  async set(d){const{error}=await sb.from('docs').upsert({path,col:pcolOf(path),data:d,updated_at:new Date().toISOString()},{onConflict:'path'});sbErr(error)},
  async update(d){const cur=await this.get();if(!cur.exists){const x=new Error('Document introuvable');x.code='invalid_argument';throw x}await this.set({...cur.data(),...d})},
  async delete(){const{error}=await sb.from('docs').delete().eq('path',path);sbErr(error)},
  async acquire({holder,ttlMs=30000}){const{data,error}=await sb.rpc('acquire_lease',{p_path:path,p_holder:holder,p_ttl_ms:Math.max(1000,ttlMs)});sbErr(error);return{acquired:!!data}},
  onSnapshot(n,e){let row=null;const l={apply:({row:r})=>{row=r;n(dsnap(path,row))},resync:async()=>{try{const s=await docRef(path).get();n(s)}catch(x){e&&e(x)}}};

  _match(d){return(q.where||[]).every(([f,op,v])=>{const x=d[f];return op==='array-contains'?Array.isArray(x)&&x.includes(v):op==='=='?x===v:op==='!='?x!==v:op==='<'?x<v:op==='<='?x<=v:op==='>'?x>v:op==='>='?x>=v:op==='in'?v.includes(x):op==='not-in'?!v.includes(x):true})},

// ---------- connexion : pseudo + mot de passe ----------
const slugPseudo=p=>p.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]/g,'');
const pseudoMail=p=>`${slugPseudo(p)}@joueurs.couronne-orion.app`;
function authMsg(e){const m=(e&&(e.message||e.code))||'';
  if(/invalid login|invalid_credentials/i.test(m))return'Pseudo ou mot de passe incorrect.';
  if(/already registered|already exists|user_already_exists/i.test(m))return'Ce pseudo est déjà pris.';
  if(/password should be at least|weak_password/i.test(m))return'Le mot de passe doit faire au moins 6 caractères.';
  if(/email not confirmed/i.test(m))return'Compte non confirmé : désactive « Confirm email » dans Supabase (Authentication → Sign In / Providers → Email).';
  if(/rate limit|too many/i.test(m))return'Trop d’essais. Patiente quelques minutes.';
  if(/fetch|network/i.test(m))return'Pas de connexion internet.';return'Erreur : '+m}
let loginMode='in';

        ${loginMode==='up'?'<label for="lpass2"><h2>Confirme le mot de passe</h2></label><input id="lpass2" type="password" autocomplete="new-password" minlength="6">':''}

      </form>

  document.getElementById('loginf').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('lpseudo').value,pw=document.getElementById('lpass').value,er=document.getElementById('lerr');

// ---------- démarrage ----------
let started=false;
function boot(){
  if(!sbInit()){S.nodb=true;render();return}
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user;
    if(!u){if(window.__upd)return;if(started&&ev==='SIGNED_OUT')location.reload();else if(!started)showLogin();return}
    if(started)return;ME=u.id;try{const ps=localStorage.getItem('orion-pseudo');if(ps)S.pseudo=ps}catch(e){}if(!S.pseudo)S.pseudo=(u.email||'').split('@')[0];setTimeout(startGame,0)})}
function startGame(){if(started)return;started=true;db=DBA;main.innerHTML='<div class="join"><div class="hero">Couronne <span>d\'Orion</span></div><p class="lead">Connexion à la galaxie…</p></div>';
  const seen={p:0,pl:0,f:0,r:0};const ready=k=>{if(!seen[k]){seen[k]=1;S.ready++}render()};
  const fail=e=>{console.error(e);if(e&&e.code==='invalid_argument'){S.nodb=true;S.nodbMsg='Accès refusé par la base de données. Vérifie que le script SQL a bien été exécuté dans Supabase.';render()}};
  db.collection('planets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='planet'&&x.pid)o[x.pid]=x}S.planets=o;ready('p')},fail);
  db.collection('players').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='player')o[x.uid]=x}S.players=o;ready('pl')},fail);
  db.collection('fleets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='fleet')o[x.fid]=x}S.fleets=o;ready('f')},fail);
  db.collection('chat').onSnapshot(s=>{S.chat=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.kind==='chat'&&m.text).sort((a,b)=>a.at-b.at).slice(-120);chatUpdate()},()=>{});
  db.collection('events').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='event')o[x.id]=x}S.events=o;if(S.ready>=3)render()},fail);
  db.collection('reports').where('to','array-contains',ME).orderBy('at','desc').limit(60).onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.kind==='report');reportSounds();if(S.ready>=3)render()},fail);
  setInterval(tick,1000);
  if(notifOk()&&pushOn())setTimeout(()=>pushSubscribe(true),4000);
}

// ---------- mises à jour : chaque nouvelle version déconnecte les joueurs et recharge l'appli ----------
const APP_VERSION='93';
async function checkUpdate(){if(window.__upd)return;let v;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;v=String((await r.json()).v)}catch(e){return}
  if(!v||v===APP_VERSION)return;let k={};try{k=JSON.parse(localStorage.getItem('orion-upd')||'{}')}catch(e){}
  if(k.v===v&&Date.now()-k.at<90000)return; // la page vient d'être rechargée : on laisse le temps au serveur de servir la nouvelle version
  window.__upd=true;document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#05081acc;color:#fff;font:600 17px system-ui;text-align:center;padding:20px">Nouvelle version du jeu<br><span style="font-weight:400;font-size:14px;opacity:.8">Reconnexion en cours…</span></div>');
  const T=(pr,ms=2500)=>Promise.race([Promise.resolve(pr).catch(()=>{}),sleep(ms)]); // aucune étape ne doit bloquer
  setTimeout(()=>location.reload(),8000);
  try{localStorage.setItem('orion-upd',JSON.stringify({v,at:Date.now()}))}catch(e){}
  if(k.v!==v&&sb){await T(sb.auth.signOut({scope:'local'}));try{for(const x of Object.keys(localStorage))if(x.startsWith('sb-'))localStorage.removeItem(x)}catch(e){}}
  try{await T(caches.keys().then(ks=>Promise.all(ks.map(x=>caches.delete(x)))))}catch(e){}
  try{await T(navigator.serviceWorker.getRegistration().then(rg=>rg&&rg.update()))}catch(e){}
  location.href=location.pathname+'?v='+v}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
