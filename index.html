<style>

function mpFog(){if(!MP.fog)return;const g=MP.fog.geometry,P=g.attributes.position.array,Z=g.attributes.sz.array;let n=0;
  if(MP.level!=='universe'&&visibleSet())for(const s of SYS_BY_GAL[MP.gal]){if(sysVisible(s.i)||n>=1500)continue;const r=rng(hash('fog'+s.i));

async function claimQuest(id){const Q=QUESTS.find(q=>q.id===id);if(!Q)return;await act(async()=>{const[c,g]=Q.need(qStats());if(c<g)throw err('Objectif pas encore atteint.');
  await withPlayer(ME,d=>{d.quests=d.quests||[];if(d.quests.includes(id))throw err('Récompense déjà réclamée.');d.quests.push(id);if(Q.ch){d.chests=d.chests||{};d.chests[Q.ch]=(d.chests[Q.ch]||0)+1}if(Q.rr)for(const k in Q.rr)d.rare[k]=(d.rare[k]||0)+Q.rr[k]});
  const cap=capitalOf(ME);if(cap&&Q.r)await locked('planets/'+cap.pid,async(pd,ref)=>{if(!pd)return;const p=settle(pd,Date.now());addRes(p.res,Q.r);await ref.set(p)});
  sfx.done();toast(`Quête accomplie : ${Q.t}. Récompense livrée sur ta capitale.`)})}

// aide impériale : quand un seigneur perd une planète, l'Empereur renforce sa forteresse (+20 % de sa flotte, au plus toutes les 12 h)
async function imperialAid(lord,pl){const b=BOTS.find(x=>x.uid===lord);if(!b)return;let ok=false;await locked('players/'+lord,async(x,ref)=>{if(!x||!x.bot||Date.now()-(x.bot.aidAt||0)<12*HR)return;x.bot={...x.bot,aidAt:Date.now()};await ref.set(x);ok=true}).catch(()=>{});if(!ok)return;
  const W=playerPower(lord)*.2,A=botArmy(W),seat=S.planets[b.seat]&&S.planets[b.seat].owner===lord?b.seat:(botPlanets(lord).filter(q=>!isBody(q.pid))[0]||{}).pid;if(!seat)return;
  await locked('planets/'+seat,async(d,ref)=>{if(!d||d.owner!==lord)return;const p=settle(d,Date.now());for(const k in A)p.ships[k]=(p.ships[k]||0)+A[k];while(bayCap(p)<placesOf(p.ships)&&p.lv.bay<20)p.lv.bay++;await ref.set(p)}).catch(()=>{});
  await univPost('vorgath','L’Empereur Vorgath',`👑 ${b.name} a perdu ${pl}. Le Trône lui envoie des renforts. Ne vous réjouissez pas trop vite.`,'aid-'+lord+'-'+Math.floor(Date.now()/HR),true)}
async function univBattle(r){const pv=pvpInfo(r);if(!pv)return;const def=pv.def[0],pl=uplName(r.battle.pid),k=(r.battle.pid||'')+'-'+Math.floor(Date.now()/30000);
  const sys=PLANETS[r.battle.pid]?SYSTEMS[PLANETS[r.battle.pid].sys].name:'Orion';
  if(isBot(def)){const hum=pv.att.filter(u=>!isBot(u));if(!hum.length)return;const p=hum.map(pname).join(' et '),kind=/annexé/.test(r.title||'')?'lost':pv.win==='def'?'dwin':pv.win==='att'?'dloss':'draw';await univSay(def,kind,{p,pl},k,kind==='lost');
    for(const u of hum){const nk=await relUpdate(def,u,kind==='lost'?12:kind==='dloss'?10:kind==='dwin'?-8:0,{k:kind==='lost'?'pa':kind==='dloss'?'pw':kind==='dwin'?'pl':'x',pl,sys});if(nk)await talkQ([{id:'u-n-'+def+'-'+u+'-'+talkNorm(nk).replace(/ /g,''),uid:def,text:talkPick(def,'nick',k).replace(/\{nick\}/g,nk).replace(/\{p\}/g,pname(u)),at:Date.now()+70e3,re:u}])}
    if(kind==='lost')await imperialAid(def,pl).catch(()=>{});
    if(kind==='dloss'||kind==='lost'){await sagaFlag(kind==='lost'?'breach':'blood');if(kind==='lost')await sagaFlag('blood');if(hash(k)%5<3)await talkQ(disputeItems(def,'b'+k,Date.now()+100e3))}return}
  const b=pv.att.find(isBot);if(b){await univSay(b,pv.win==='att'?'awin':pv.win==='def'?'aloss':'draw',{p:pname(def),pl},k,true);await relUpdate(b,def,pv.win==='def'?8:pv.win==='att'?-5:0,{k:pv.win==='att'?'lw':pv.win==='def'?'ll':'x',pl,sys});if(pv.win==='def')await sagaFlag('blood')}}

  const rar=rollRar(C.p,Math.random()),order=['l','e','r','c'],tries=[rar,...order.slice(order.indexOf(rar)+1),...order.slice(0,order.indexOf(rar)).reverse()],mine=new Set(cmdsOf(ME).map(c=>c.key));let got=null,dup=null;

async function recall(fid){await act(async()=>{await locked('fleets/'+fid,async(f,ref)=>{const now=Date.now();if(!f||f.owner!==ME||f.phase!=='out'||f.arrive<=now)throw err('Cette flotte ne peut plus être rappelée.');

async function join(){const name=(document.getElementById('pseudo').value||'').trim().slice(0,18);if(name.length<2)return toast('Choisis un nom d’au moins 2 caractères.','bad');

  const others=Object.values(S.planets).filter(q=>q.owner&&!isNpc(q.owner)&&!isBot(q.owner)&&PLANETS[q.pid]&&galOf(q.pid)===0).map(q=>SYSTEMS[PLANETS[q.pid].sys]);let c=[];
  if(others.length){const dmin=s0=>Math.min(...others.map(o=>Math.hypot(o.x-s0.x,o.y-s0.y,o.z-s0.z)));for(const[lo,hi]of[[70,115],[55,140],[40,170]]){c=Object.values(PLANETS).filter(p=>free(p)&&SYSTEMS[p.sys].gal===0&&!SYSTEMS[p.sys].deep&&!pbOfPid(p.pid)&&(()=>{const d=dmin(SYSTEMS[p.sys]);return d>=lo&&d<=hi})());if(c.length)break}}

  if(anchor){const A=SYSTEMS[PLANETS[anchor.pid].sys];c=Object.values(PLANETS).filter(p=>free(p)&&SYSTEMS[p.sys].gal===A.gal).map(p=>({p,d:Math.hypot(SYSTEMS[p.sys].x-A.x,SYSTEMS[p.sys].y-A.y,SYSTEMS[p.sys].z-A.z)})).filter(x=>x.d>=30).sort((a,b)=>a.d-b.d);const near=[...new Set(c.map(x=>x.p.sys))].slice(0,4);c=c.filter(x=>near.includes(x.p.sys)).map(x=>x.p)}

    if(ok){await db.doc('players/'+ME).set({kind:'player',uid:ME,name,color,joined:Date.now(),rare:{ir:40,xe:10,am:0},rareAt:Date.now(),tech:{},loadout:{},paint:{}});S.sel=cand.pid;S.tab='planet';sfx.win();toast(`Bienvenue, ${name}. Ta capitale est ${cand.name}.`);newcomerRp(ME,name,cand.pid).catch(()=>{});return}}

async function homecoming(f,fref){let dest=fleetBase(f);const o=S.planets[dest];const cmdLand=async()=>{if(f.cmd&&dest&&S.players[f.owner])await withPlayer(f.owner,d=>{const c=(d.cmds||[]).find(x=>x.id===f.cmd);if(c&&!(c.move&&c.move.until>Date.now())&&c.base!==dest){c.base=dest;c.guard=false}}).catch(()=>{})};

async function resolveDue(){if(!db||S.spectator)return;const G=S.got||{};if(!(G.f&&G.e&&G.p&&G.pl))return;await battleTicks();await pillardTick().catch(()=>{});await pactTick().catch(e=>console.warn('pact',e));await invasionTick().catch(e=>console.warn('invasion',e));await crusadeTick().catch(e=>console.warn('croisade',e));await botTick().catch(()=>{});if(S.players[ME]&&!isBot(ME)&&Date.now()-TALK_T>6000){TALK_T=Date.now();await botTalkTick(Date.now()).catch(e=>console.warn('botTalk',e))}await projIntro().catch(()=>{});await eliteIntro().catch(()=>{});await lordTick().catch(()=>{});await enemyPwTick().catch(()=>{});await sectorTick().catch(()=>{});await bayMigrate().catch(()=>{});await relicTick().catch(()=>{});await pbTick().catch(()=>{});await deepTick().catch(()=>{});const now=Date.now();
  // ordre chronologique : une flotte arrivée avant l'heure de départ d'un ralliement est traitée avant lui (rattrapage après une absence)
  const tOf=f=>f.phase==='rally'?f.rallyUntil:f.phase==='out'?f.arrive:f.phase==='back'?f.back:Infinity;
  for(const f of Object.values(S.fleets).sort((a,b)=>(tOf(a)||0)-(tOf(b)||0))){if(busy.has(f.fid))continue;if(f.group){const L=S.fleets[f.group];if(L&&(L.phase==='out'||L.phase==='rally'))continue}if(f.phase==='rally'){if(!f.rem5&&f.rallyUntil>now&&f.rallyUntil-now<=5*60000&&f.rallyUntil-(f.depart||0)>6*60000&&!busy.has('m'+f.fid)){busy.add('m'+f.fid);rallyRemind(f.fid).catch(()=>{}).finally(()=>busy.delete('m'+f.fid))}if(f.rallyUntil<=now&&!busy.has('r'+f.fid)){busy.add('r'+f.fid);try{await rallyLaunch(f.fid,true)}catch(e){}finally{busy.delete('r'+f.fid)}}continue}if(f.phase==='rwait'){const L=S.fleets[f.rally];if((!L||L.phase!=='rally')&&now-(f.holdAt||0)>60000&&!busy.has(f.fid)){busy.add(f.fid);try{await locked('fleets/'+f.fid,async(fd,fref)=>{const L2=S.fleets[fd&&fd.rally];if(fd&&fd.phase==='rwait'&&(!L2||L2.phase!=='rally'))await sendBack(fd,fref,'Le ralliement est parti sans ta flotte : elle rentre à sa base.')})}catch(e){}finally{busy.delete(f.fid)}}continue}
    if(f.phase==='wait'){const c=S.fleets[f.target];if(!c||c.phase!=='out'){busy.add(f.fid);try{await locked('fleets/'+f.fid,async(fd,fref)=>{if(fd&&fd.phase==='wait')await holdAt(fd,fref,fd.ships,fd.cargo,{target:null})})}catch(e){}finally{busy.delete(f.fid)}}continue}
    if(f.phase==='hold'){const nx=ambushNext(f);if(nx&&nx<=now){busy.add(f.fid);try{await locked('fleets/'+f.fid,async(fd,fref)=>{if(fd&&fd.phase==='hold')await ambush(fd,fref)})}catch(e){}finally{busy.delete(f.fid)}}continue}
    const due=f.phase==='out'?f.arrive<=now:f.phase==='back'?f.back<=now:false;if(!due)continue;
    busy.add(f.fid);try{await locked('fleets/'+f.fid,async(fd,fref)=>{if(!fd||fd.phase!==f.phase)return;const t1=Date.now();if(fd.phase==='out'&&!(fd.arrive<=t1))return;if(fd.phase==='back'&&!(fd.back<=t1))return;if(fd.group){const L1=S.fleets[fd.group];if(L1&&(L1.phase==='out'||L1.phase==='rally'))return}if(fd.phase==='out')await arrival(fd,fref);else await homecoming(fd,fref)})}catch(e){if(e&&e.code==='invalid_argument')S.spectator=true}finally{busy.delete(f.fid)}}}

function pvpInfo(r){const b=r&&r.battle;if(!b||!b.def||!S.players[b.def])return null;const att=[...new Set((b.att||[]).map(x=>x.uid).filter(u=>u&&u!==b.def))];if(!att.length)return null;return{att,def:[b.def],win:r.loser===b.def?'att':att.includes(r.loser)?'def':null}}
function pvpHtml(pv){if(!pv||!pv.att||!pv.def)return'';const nm=u=>`<span class="pvp-n"><i style="background:${esc(pcolor(u))}"></i>${esc(pname(u))}</span>`,W=pv.win==='att'?pv.att:pv.win==='def'?pv.def:null,L=pv.win==='att'?pv.def:pv.win==='def'?pv.att:null;
  const k=!W?'draw':W.includes(ME)?'win':L.includes(ME)?'loss':'neu',tag={draw:'INDÉCIS',win:'VICTOIRE',loss:'DÉFAITE',neu:'VAINQUEUR'}[k];

// catégorie d'un message du Journal : couleur et étiquette
function repCat(r){const t=(r.title||'')+' '+(r.lines||[]).join(' ');
  if(r.feat||/^🏆/.test(r.title||''))return['feat','🏆','Exploit'];
  if(r.battle&&!/espionn/i.test(r.title||''))return['war','⚔','Combat'];
  if(r.intel||/espionnage|sondes|Sonde /i.test(r.title||''))return['spy','🔭','Espionnage'];
  if(/^(📡|🧭|💎|🏺)/.test(r.title||'')||/signal/i.test(r.title||''))return['exp','📡','Exploration'];
  if(/foncent sur|attaque |contre-attaque|expédition punitive|raid|vendetta|repaire|☠|⚠/i.test(r.title||'')&&!r.battle)return['thr','⚠','Menace'];
  if(r.battle||/bataille|anéantis|assaut|combat|repouss|chassés|vaincu/i.test(r.title||''))return['war','⚔','Combat'];
  if(/convoi|comète|récolt|colon|satellite|coffre|rattrapage|livr|marché|comptoir|quête/i.test(t))return['eco','💰','Économie'];
  return['inf','ℹ','Info']}

function renderLog(){const lt=S.logTab||'combat',isSpy=r=>repCat(r)[0]==='spy',R=S.reports.filter(r=>lt==='rally'?r.rally:r.rally?false:lt==='spy'?isSpy(r):lt==='combat'?isCombatRep(r)&&!isSpy(r):!isCombatRep(r)&&!isSpy(r));return`<section style="display:grid;gap:10px"><h1>Journal</h1><div class="chips"><button class="chip" data-act="logt" data-t="combat" aria-pressed="${lt==='combat'}">Combats</button><button class="chip" data-act="logt" data-t="rally" aria-pressed="${lt==='rally'}">⚑ Ralliements</button><button class="chip" data-act="logt" data-t="spy" aria-pressed="${lt==='spy'}">🔭 Espionnage</button><button class="chip" data-act="logt" data-t="other" aria-pressed="${lt==='other'}">Autres</button></div>${R.length?`<div class="list">${groupReps(R).map(G=>{const r=G.r;const tone=r.tone==='info'?'info':(r.loser===ME?'loss':(r.tone==='win'||r.loser)?'win':'loss');const ct=repCat(r);return`<div class="item rep tone-${tone} cat-${ct[0]}"><div class="ihead"><b><span class="rcat">${ct[1]} ${ct[2]}</span>${esc((r.title||'').replace(/^(🏆|📡|⚔|🔭|⚠)\s*/u,''))}${G.more.length?` <span class="rcnt">×${G.more.length+1}</span>`:''}</b><time>${new Date(r.at).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</time></div>${pvpHtml(pvpInfo(r))}${(r.lines||[]).map(l=>`<p>${repLine(l)}</p>`).join('')}${r.battle?`<div class="foot"><span></span><button class="btn ghost sm" data-act="replay" data-r="${r.id}">Voir la bataille</button></div>`:''}${(()=>{const pk=(r.intel&&r.intel.pid)||(r.battle&&r.battle.pid)||r.pid;const m=pk&&PLANETS[pk];return m?`<div class="foot"><span></span><button class="btn ghost sm" data-act="pmap" data-s="${m.sys}" data-p="${esc(pk)}">📍 Voir sur la carte</button></div>`:''})()}${G.more.length?`<details class="rgrp"><summary>+ ${G.more.length} rapport${G.more.length>1?'s':''} du même genre</summary>${G.more.map(x=>`<div class="rsub"><time>${new Date(x.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</time>${(x.lines||[]).m     for(const n of notes)for(const det of[-6,6]){const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;o.type='sawtooth';o.frequency.value=NOTE(n);o.detune.value=det;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.011,t+3);g.gain.setValueAtTime(.011,t+7);g.gain.linearRampToValueAtTime(0,t+10.5);o.connect(f).connect(g);g.connect(FLYA.mus);g.connect(FLYA.rv);o.start(t);o.stop(t+11)}
    const b=c.createOscillator(),bg=c.createGain();b.type='sine';b.frequency.value=NOTE(root);bg.gain.setValueAtTime(0,t);bg.gain.linearRampToValueAtTime(.09,t+2);bg.gain.linearRampToValueAtTime(0,t+8.5);b.connect(bg).connect(FLYA.mus);b.start(t);b.stop(t+9)}
  if(Math.random()<.22){const n=FLY_SC[Math.floor(Math.random()*FLY_SC.length)];for(const[ty,mul,v]of[['sine',1,.03],['sine',2.01,.012],['triangle',3,.006]]){const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=NOTE(n)*mul;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+3.5);o.connect(g);g.connect(FLYA.dl);g.connect(FLYA.rv);o.start(t);o.stop(t+3.6)}}
  FLYA.next+=.5;FLYA.step++}}
function flyAudioTick(){if(!FLYA.on||!SFX.ctx)return;const c=SFX.ctx,t=c.currentTime,v=FLY.v,th=FLY.thr||0,b=FLY.boosting;
  FLYA.eng.gain.setTargetAtTime(.05+th*.1+(b?.06:0),t,.15);FLYA.lp.frequency.setTargetAtTime(160+v*900+th*260,t,.2);for(const[o,f]of FLYA.osc)o.frequency.setTargetAtTime(f*(1+v*1.6+th*.25),t,.25);
  FLYA.ng.gain.setTargetAtTime(.012+v*.12+(b?.09:0),t,.2);FLYA.bp.frequency.setTargetAtTime(350+v*2600+(b?900:0),t,.25);

    if(!rec){const h=bodyH(pid,v.x,v.y,v.z);ramp(BSTOPS[t],h,c);rec=[BODYR[t]*(1+BAMP[t]*h),c.r,c.g,c.b];memo.set(key,rec)}

// ---------- connexion : pseudo + mot de passe ----------
const slugPseudo=p=>p.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]/g,'');
const pseudoMail=p=>`${slugPseudo(p)}@joueurs.couronne-orion.app`;
function authMsg(e){const m=(e&&(e.message||e.code))||'';
  if(/invalid login|invalid_credentials/i.test(m))return'Pseudo ou mot de passe incorrect.';
  if(/already registered|already exists|user_already_exists/i.test(m))return'Ce pseudo est déjà pris.';
  if(/password should be at least|weak_password/i.test(m))return'Le mot de passe doit faire au moins 6 caractères.';
  if(/email not confirmed/i.test(m))return'Compte non confirmé : désactive « Confirm email » dans Supabase (Authentication → Sign In / Providers → Email).';
  if(/rate limit|too many/i.test(m))return'Trop d’essais. Patiente quelques minutes.';
  if(/fetch|network/i.test(m))return'Pas de connexion internet.';return'Erreur : '+m}
let loginMode='in';
// ---------- installer l'appli sur l'écran d'accueil ----------
let INSTALL_EV=null;const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inAppBrowser=()=>/FBAN|FBAV|Instagram|Line\/|Snapchat|WhatsApp|GSA\//i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EV=e;try{if(typeof render==='function'&&S.ready>=3)render()}catch(x){}});
addEventListener('appinstalled',()=>{INSTALL_EV=null;try{localStorage.setItem('orion-installed','1')}catch(e){}});
const installHidden=()=>{try{return localStorage.getItem('orion-installx')==='1'}catch(e){return false}};
function installBanner(){if(isStandalone()||(installHidden()&&location.hash!=='#installer'))return'';return`<div class="chip2 gold instb"><span>📲 <b>Installe le jeu sur ton écran d’accueil</b><span>une icône, l’appli s’ouvre en plein écran, avec les notifications</span></span><span style="display:flex;gap:6px;flex:none"><button class="btn sm" data-act="install">Installer</button><button class="mppx" data-act="installx" aria-label="Masquer">✕</button></span></div>`}
// guide animé iPhone : une flèche qui rebondit montre où toucher dans Safari, étape par étape
const iosVer=()=>{const m=navigator.userAgent.match(/OS (\d+)_/)||navigator.userAgent.match(/Version\/(\d+)/);return m?+m[1]:0};
const isIPad=()=>/ipad/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let IG={i:0};
function iosGuide(){let el=document.getElementById('iosg');if(!el){el=document.createElement('div');el.id='iosg';document.body.appendChild(el)}const v26=iosVer()>=26,pad=isIPad();
  const shareIco='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>',addIco='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  const steps=v26&&!pad?[{t:'Touche le bouton <b>•••</b> en bas à droite de Safari',pos:'br',ico:'<b style="font-size:20px;letter-spacing:2px">•••</b>'},{t:'Touche <b>Partager</b>',pos:'mid',ico:shareIco},{t:'Fais défiler et touche <b>Sur l’écran d’accueil</b>',pos:'mid',ico:addIco},{t:'Touche <b>Ajouter</b> en haut à droite : c’est fini !',pos:'tr',ico:'<b>Ajouter</b>'}]
    :[{t:pad?'Touche le bouton <b>Partager</b> en haut à droite de Safari':'Touche le bouton <b>Partager</b> en bas de Safari',pos:pad?'tr':'bc',ico:shareIco},{t:'Fais défiler et touche <b>Sur l’écran d’accueil</b>',pos:'mid',ico:addIco},{t:'Touche <b>Ajouter</b> en haut à droite : c’est fini !',pos:'tr',ico:'<b>Ajouter</b>'}];
  const i=Math.min(IG.i,steps.length-1),S0=steps[i];
  el.innerHTML=`<div class="iosg" data-act="iosgx"><div class="iosgcard" data-stop="1"><div class="iosgstep">Étape ${i+1}/${steps.length}</div><div class="iosgico">${S0.ico}</div><p>${S0.t}</p>
    ${S0.pos==='mid'?`<div class="iosgmock"><span>${S0.ico}</span><b>${i===steps.length-2?'Sur l’écran d’accueil':'Partager'}</b><i>👈</i></div>`:''}
    <div class="iosgbtn">${i>0?'<button class="btn ghost sm" data-act="iosgp">Retour</button>':'<span></span>'}${i<steps.length-1?'<button class="btn sm" data-act="iosgn">C’est fait, ensuite</button>':'<button class="btn sm" data-act="iosgx">Terminé</button>'}</div></div>
    ${S0.pos!=='mid'?`<div class="iosgarrow ${S0.pos}">⬇</div>`:''}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='iosgn'){e.stopPropagation();IG.i++;iosGuide()}else if(a==='iosgp'){e.stopPropagation();IG.i=Math.max(0,IG.i-1);iosGuide()}
  else if(a==='iosgx'){if(e.target!==b&&e.target.closest('[data-stop]')&&b.classList.contains('iosg'))return;e.stopPropagation();const el=document.getElementById('iosg');if(el)el.innerHTML='';try{localStorage.setItem('orion-iosg','1')}catch(x){}}},true);
async function doInstall(){if(INSTALL_EV){INSTALL_EV.prompt();try{const r=await INSTALL_EV.userChoice;if(r&&r.outcome==='accepted')INSTALL_EV=null}catch(e){}return}
  if(isIOS()&&!inAppBrowser()){IG.i=0;iosGuide();return}
  let el=document.getElementById('instx');if(!el){el=document.createElement('div');el.id='instx';document.body.appendChild(el)}
  const ios=isIOS(),steps=inAppBrowser()?[`Ce lien s’est ouvert dans l’application de discussion. Touche le menu (⋯ ou ⋮) puis <b>Ouvrir dans ${ios?'Safari':'le navigateur'}</b>.`,'Recommence ensuite depuis ce bouton.']
    :ios?['Touche le bouton <b>Partager</b> (le carré avec une flèche ⬆ vers le haut), en bas de Safari.','Fais défiler et choisis <b>Sur l’écran d’accueil</b>.','Touche <b>Ajouter</b> : l’icône Couronne d’Orion apparaît sur ton écran d’accueil.']
    :['Touche le menu <b>⋮</b> en haut à droite du navigateur.','Choisis <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.','Confirme : l’icône Couronne d’Orion apparaît sur ton écran d’accueil.'];
  el.innerHTML=`<div class="scrim" data-act="instclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="Installer l’appli" data-stop="1"><h2 style="margin:0">📲 Installer Couronne d’Orion</h2><ol style="margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.45">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="eff" style="margin:0;font-size:12px">Lien à partager pour installer le jeu : <b style="user-select:all">${esc(location.origin+location.pathname)}#installer</b></p><div class="foot"><button class="btn ghost sm" data-act="instcopy">Copier le lien</button><button class="btn sm" data-act="instclose">Compris</button></div></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='install'){e.stopPropagation();doInstall()}
  else if(a==='installx'){e.stopPropagation();try{localStorage.setItem('orion-installx','1')}catch(x){}if(location.hash==='#installer')history.replaceState(null,'',location.pathname+location.search);const c=b.closest('.instb');if(c)c.remove()}
  else if(a==='instclose'){if(e.target!==b&&e.target.closest('[data-stop]')&&b.classList.contains('scrim'))return;const el=document.getElementById('instx');if(el)el.innerHTML=''}
  else if(a==='instcopy'){const u=location.origin+location.pathname+'#installer';try{navigator.clipboard.writeText(u).then(()=>{try{toast('Lien copié.')}catch(x){}},()=>{})}catch(x){}}},true);
if(location.hash==='#installer'&&!isStandalone())setTimeout(doInstall,1200);
else if(isIOS()&&!isStandalone()&&!inAppBrowser()&&!installHidden()){let seen=false;try{seen=localStorage.getItem('orion-iosg')==='1'}catch(e){}if(!seen)setTimeout(()=>{if(!document.getElementById('iosg')||!document.getElementById('iosg').innerHTML){IG.i=0;iosGuide()}},2500)}
function showLogin(msg){top_.hidden=true;tabsEl.hidden=true;v3Sync(false);hgSync(false);mpel.hidden=true;
  main.innerHTML=`<div class="join"><div class="hero">Couronne <span>d'Orion</span></div><p class="lead">Un univers de ${GALS.length} galaxies à conquérir entre amis.</p>
    <div class="card" style="display:grid;gap:12px"><div class="chips"><button class="chip" data-act="lmode" data-m="in" aria-pressed="${loginMode==='in'}">Se connecter</button><button class="chip" data-act="lmode" data-m="up" aria-pressed="${loginMode==='up'}">Créer un compte</button></div>
      <form id="loginf" style="display:grid;gap:10px" autocomplete="on">
        <label for="lpseudo"><h2>Pseudo</h2></label><input id="lpseudo" name="username" autocomplete="username" maxlength="20" autocapitalize="none" placeholder="Ex. vega42" value="${esc((()=>{try{return localStorage.getItem('orion-pseudo')||''}catch(e){return''}})())}">
        <label for="lpass"><h2>Mot de passe</h2></label><input id="lpass" type="password" name="password" autocomplete="${loginMode==='up'?'new-password':'current-password'}" minlength="6" placeholder="6 caractères minimum">
        ${loginMode==='up'?'<label for="lpass2"><h2>Confirme le mot de passe</h2></label><input id="lpass2" type="password" autocomplete="new-password" minlength="6">':''}
        <p id="lerr" class="eff" style="margin:0;color:var(--bad)">${msg?esc(msg):''}</p>
        <div><button class="btn" type="submit">${loginMode==='up'?'Créer mon compte':'Entrer dans la galaxie'}</button></div>
      </form>
      ${installBanner()}<p class="meta" style="margin:0">${loginMode==='up'?'Ton pseudo est unique. Note bien ton mot de passe : il n’y a pas de récupération automatique.':'Mot de passe oublié ? Demande à l’hôte du jeu de réinitialiser ton compte.'}</p></div></div>`;
  document.getElementById('loginf').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('lpseudo').value,pw=document.getElementById('lpass').value,er=document.getElementById('lerr');
    const s=slugPseudo(p);if(s.length<3)return er.textContent='Le pseudo doit contenir au moins 3 lettres ou chiffres.';if(pw.length<6)return er.textContent='Le mot de passe doit faire au moins 6 caractères.';
    if(loginMode==='up'&&pw!==document.getElementById('lpass2').value)return er.textContent='Les deux mots de passe ne correspondent pas.';
    er.textContent='Connexion…';try{localStorage.setItem('orion-pseudo',p.trim())}catch(x){}
    const r=loginMode==='up'?await sb.auth.signUp({email:pseudoMail(p),password:pw}):await sb.auth.signInWithPassword({email:pseudoMail(p),password:pw});
    if(r.error)return er.textContent=authMsg(r.error);
    if(loginMode==='up'&&!r.data.session)er.textContent=authMsg({message:'email not confirmed'})})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='lmode'){loginMode=b.dataset.m;showLogin()}
  if(b.dataset.act==='logout'){sb&&sb.auth.signOut().then(()=>location.reload())}});

// ---------- démarrage ----------
let started=false;
function boot(){
  if(!sbInit()){S.nodb=true;render();return}
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user;
    if(!u){if(window.__upd)return;if(started&&ev==='SIGNED_OUT')location.reload();else if(!started)showLogin();return}
    if(started)return;ME=u.id;try{const ps=localStorage.getItem('orion-pseudo');if(ps)S.pseudo=ps}catch(e){}if(!S.pseudo)S.pseudo=(u.email||'').split('@')[0];setTimeout(startGame,0)})}
function startGame(){if(started)return;started=true;db=DBA;main.innerHTML='<div class="join"><div class="hero">Couronne <span>d\'Orion</span></div><p class="lead">Connexion à la galaxie…</p></div>';
  const seen={p:0,pl:0,f:0,r:0};const ready=k=>{if(!seen[k]){seen[k]=1;S.ready++}render()};
  const fail=e=>{console.error(e);if(e&&e.code==='invalid_argument'){S.nodb=true;S.nodbMsg='Accès refusé par la base de données. Vérifie que le script SQL a bien été exécuté dans Supabase.';render()}};
  db.collection('planets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='planet'&&x.pid)o[x.pid]=x}S.planets=o;S.got=S.got||{};S.got.p=1;ready('p')},fail);
  db.collection('players').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='player')o[x.uid]=x}if(S.awayFrom==null&&ME&&o[ME])S.awayFrom=o[ME].seen||0;S.players=o;S.got=S.got||{};S.got.pl=1;ready('pl')},fail);
  db.collection('fleets').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='fleet')o[x.fid]=x}S.fleets=o;S.got=S.got||{};S.got.f=1;ready('f')},fail);
  db.collection('chat').onSnapshot(s=>{{const A=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.kind==='chat'&&m.text).sort((a,b)=>a.at-b.at);S.chat=[...A.filter(m=>chOf(m)==='j').slice(-120),...A.filter(m=>chOf(m)==='u').slice(-120)].sort((a,b)=>a.at-b.at)}chatUpdate()},()=>{});
  db.collection('events').onSnapshot(s=>{const o={};for(const d of s.docs){const x=d.data();if(x&&x.kind==='event')o[x.id]=x}S.events=o;S.got=S.got||{};S.got.e=1;if(S.ready>=3)render()},fail);
  db.collection('reports').where('to','array-contains',ME).orderBy('at','desc').limit(100).onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.kind==='report');reportSounds();if(S.ready>=3)render()},fail);
  setInterval(tick,1000);
  if(notifOk()&&pushOn())setTimeout(()=>pushSubscribe(true),4000);
}
boot();
// ---------- mises à jour : chaque nouvelle version déconnecte les joueurs et recharge l'appli ----------
const APP_VERSION='248';
async function checkUpdate(){if(window.__upd)return;let v;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;v=String((await r.json()).v)}catch(e){return}
  if(!v||v===APP_VERSION)return;let k={};try{k=JSON.parse(localStorage.getItem('orion-upd')||'{}')}catch(e){}
  if(k.v===v&&Date.now()-k.at<90000)return; // la page vient d'être rechargée : on laisse le temps au serveur de servir la nouvelle version
  window.__upd=true;document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#05081acc;color:#fff;font:600 17px system-ui;text-align:center;padding:20px">Nouvelle version du jeu<br><span style="font-weight:400;font-size:14px;opacity:.8">Chargement en cours…</span></div>');
  const T=(pr,ms=2500)=>Promise.race([Promise.resolve(pr).catch(()=>{}),sleep(ms)]); // aucune étape ne doit bloquer
  setTimeout(()=>location.reload(),8000);
  try{localStorage.setItem('orion-upd',JSON.stringify({v,at:Date.now()}))}catch(e){}
  // la session reste ouverte : on vide seulement le cache et on recharge
  try{await T(caches.keys().then(ks=>Promise.all(ks.map(x=>caches.delete(x)))))}catch(e){}
  try{await T(navigator.serviceWorker.getRegistration().then(rg=>rg&&rg.update()))}catch(e){}
  location.href=location.pathname+'?v='+v}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
